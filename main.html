<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Core Counting — Main</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0908; --bg-elev:#0f0d0a; --panel:#16130f; --panel2:#1c1811; --line:#2a231a; --line2:#3a3122;
    --text:#e8e0d4; --dim:#8a8072; --dim2:#5f574a;
    --amber:#ff8a1e; --amber2:#d9700f; --amber-dim:#7a4a1a; --amber-bg:rgba(255,138,30,.12);
    --red:#e05540; --red-bg:rgba(224,85,64,.14);
    --green:#5fb87a; --green-bg:rgba(95,184,122,.14);
    --mono:'SF Mono','Courier New',ui-monospace,monospace; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --radius:14px; --radius-sm:9px;
    --shadow:0 2px 10px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%;}
  body{background-image:radial-gradient(ellipse 900px 500px at 50% -10%, var(--amber-bg), transparent 70%);background-repeat:no-repeat;}
  #app{max-width:640px;margin:0 auto;padding:8px 16px calc(40px + env(safe-area-inset-bottom)) 16px;}

  h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .subtitle{font-size:12px;color:var(--dim);margin-bottom:14px;font-family:var(--mono);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}

  input, select{
    width:100%;padding:11px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--bg-elev);color:var(--text);font-family:var(--sans);font-size:14px;margin-top:4px;
    transition:border-color .15s;
  }
  input:focus, select:focus{outline:none;border-color:var(--amber-dim);}
  label{font-size:10.5px;color:var(--dim);font-family:var(--mono);display:block;margin-top:10px;letter-spacing:.03em;text-transform:uppercase;}
  label:first-child{margin-top:0;}

  button{font-family:var(--sans);font-weight:600;font-size:14px;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;width:100%;transition:transform .1s,opacity .1s;}
  button.primary{background:linear-gradient(180deg,#ff9a2e,#d9700f);color:#1a0e00;border:none;box-shadow:0 3px 12px rgba(255,138,30,.25);}
  button.danger{background:transparent;border:1px solid var(--red);color:var(--red);}
  button:active{opacity:.75;transform:scale(.98);}
  button:disabled{opacity:.35;}

  /* ---- Top bar ---- */
  .topBar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;background:rgba(10,9,8,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  body.light .topBar{background:rgba(245,241,232,.85);}
  .topBar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.01em;}
  .topBar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
  #themeToggle{width:auto;padding:7px 11px;font-size:11px;font-family:var(--mono);}

  /* ---- Date chip (small dropdown-style date picker, top of page) ---- */
  .dateRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .dateChip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 12px;}
  .dateChip label{margin:0;font-size:9.5px;white-space:nowrap;}
  .dateChip input{width:auto;padding:3px 6px;margin:0;border:none;background:transparent;font-size:12px;color:var(--text);}

  #pushLiveBtn{width:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:11px;background:var(--panel2);}
  #pushLiveBtn .liveDot{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex-shrink:0;}
  #pushLiveBtn.live{border-color:var(--green);color:var(--green);}
  #pushLiveBtn.live .liveDot{background:var(--green);box-shadow:0 0 6px var(--green);}

  /* ---- Stat tiles (KPIs, pinned at top) ---- */
  .statRow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
  @media (min-width:420px){ .statRow{grid-template-columns:repeat(4,1fr);} }
  .statTile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 10px;box-shadow:var(--shadow);}
  .statTile .num{font-family:var(--mono);font-size:22px;font-weight:800;line-height:1;}
  .statTile .lbl{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.04em;margin-top:5px;text-transform:uppercase;}
  .statTile.ok .num{color:var(--green);}
  .statTile.warn .num{color:var(--red);}
  .statTile.neutral .num{color:var(--amber);}

  /* ---- Scan-review cards (pending OCR jobs, bottom of page) ---- */
  .jobCard{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--panel2);}
  .rowTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .rowTop .idx{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .removeBtn{background:transparent;border:none;color:var(--red);font-size:18px;font-weight:700;width:auto;padding:2px 8px;}
  .manageSaveState{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:right;margin-top:4px;height:12px;}
  .manageSaveState.saved{color:var(--green);}

  .editPanel .fieldRow, .jobCard .fieldRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .editPanel label, .jobCard label{margin-top:8px;}

  /* ---- Tables ---- */
  .tableScroll{overflow-x:auto;max-width:100%;border-radius:var(--radius-sm);}
  table{width:100%;min-width:400px;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-family:var(--mono);white-space:nowrap;}
  th{color:var(--dim);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--panel);}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
  body.light tbody tr:nth-child(even){background:rgba(0,0,0,.02);}
  .gradeTotal{font-weight:700;color:var(--amber);}

  .badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:5px;white-space:nowrap;}
  .badge-warn{background:var(--red-bg);color:var(--red);}
  .badge-trial{background:var(--amber-bg);color:var(--amber);}

  /* ---- Compact job rows (replaces Manage + Summary tabs) ---- */
  .jobRow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:var(--panel2);
    touch-action:none;user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s, transform .15s;}
  .jobRow.dragging{box-shadow:0 8px 20px rgba(0,0,0,.45);transform:scale(1.02);position:relative;z-index:5;border-color:var(--amber-dim);}
  .jrMain{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .jrTop{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;}
  .jrAm{font-family:var(--mono);font-weight:700;color:var(--amber);font-size:13px;white-space:nowrap;}
  .jrGrade{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .jrStats{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;flex-shrink:0;}
  .jrCount.jrOk{color:var(--green);font-weight:700;}
  .jrCount.jrShort{color:var(--red);font-weight:700;}
  .jrTon{font-weight:700;min-width:44px;text-align:right;}
  .jrDip{display:flex;align-items:center;gap:3px;color:var(--dim);font-size:10px;}
  .jrDip input{width:auto;margin:0;accent-color:var(--amber);}
  .editToggleBtn{width:auto;padding:4px 10px;font-size:10.5px;margin-top:6px;background:transparent;border:1px solid var(--line);}
  .editPanel{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .jrComment{font-size:11.5px;color:var(--dim);font-style:italic;margin-top:6px;}
  #jobsEmpty{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center;padding:20px 0;}

  #status{font-family:var(--mono);font-size:12px;color:var(--dim);margin:10px 0;min-height:16px;}
  #status.err{color:var(--red);}
  #status.ok{color:var(--green);}

  .checkboxRow{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .checkboxRow input{width:auto;margin:0;}
  .checkboxRow label{margin:0;}

  #fileInput, #fileInputUpload{display:none;}
  .scanBtnRow{display:flex;gap:8px;}
  .scanBtnRow button{flex:1;}
  #loginScreen, #mainScreen{display:none;}

  details{margin-top:16px;}
  details summary{cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--dim);padding:8px 0;letter-spacing:.03em;text-transform:uppercase;}

  body.light{
    --bg:#f5f1e8; --bg-elev:#ffffff; --panel:#ffffff; --panel2:#f3ede0; --line:#ddd4c0; --line2:#c9bea3;
    --text:#1a1610; --dim:#6b6152; --dim2:#948a76;
    --amber-dim:#f0c896; --amber-bg:rgba(217,112,15,.10);
    --red-bg:rgba(192,57,43,.10); --green-bg:rgba(47,143,82,.12);
  }

  #radioBox{
    position:fixed;bottom:12px;right:12px;z-index:10;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:10px;width:180px;
    box-shadow:var(--shadow);
  }
  #radioBox .radioHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  #radioBox .radioTitle{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.03em;}
  #radioCollapseBtn{width:auto;padding:2px 6px;font-size:12px;background:transparent;border:none;color:var(--dim);}
  #radioBox.collapsed .radioBody{display:none;}
  #radioPlayBtn{width:100%;margin-top:6px;padding:8px;font-size:13px;}
  #radioUrlInput{font-size:11px;padding:6px;margin-top:0;}
</style>
</head>
<body>
<div class="topBar">
  <div class="brand"><span class="dot"></span>Core Counting</div>
  <button id="themeToggle">🌙 Dark</button>
</div>

<div id="radioBox">
  <div class="radioHead">
    <span class="radioTitle">📻 RADIO</span>
    <button id="radioCollapseBtn">▁</button>
  </div>
  <div class="radioBody">
    <input type="text" id="radioUrlInput" placeholder="stream URL">
    <button id="radioPlayBtn">▶ Play</button>
  </div>
  <audio id="radioAudio" preload="none"></audio>
</div>

<div id="app">

  <!-- ============ LOGIN ============ -->
  <div id="loginScreen">
    <h1 style="margin-top:18px;">Sign in</h1>
    <div class="subtitle">Horatio's admin page — trolley boys don't need this</div>
    <div class="card">
      <label>EMAIL</label>
      <input type="email" id="loginEmail" autocomplete="username">
      <label>PASSWORD</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
      <button class="primary" id="loginBtn" style="margin-top:16px;">Sign in</button>
      <div id="loginStatus" style="font-family:var(--mono);font-size:12px;color:var(--red);margin-top:10px;"></div>
    </div>
  </div>

  <!-- ============ MAIN APP — single page, no tabs ============ -->
  <div id="mainScreen" style="padding-top:8px;">
    <div class="subtitle" id="userEmail" style="margin-bottom:8px;"></div>

    <div class="dateRow">
      <div class="dateChip">
        <label>DAY</label>
        <input type="date" id="jobDatePicker">
      </div>
      <button id="pushLiveBtn"><span class="liveDot"></span><span id="pushLiveLabel">Push Live</span></button>
    </div>

    <!-- KPIs at the top -->
    <div class="statRow" id="summaryStats"></div>

    <div class="card" style="padding:10px 12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2 style="font-size:12px;margin:0;font-family:var(--mono);color:var(--dim);">TONNAGE BY GRADE</h2>
        <button id="refreshBtn" style="width:auto;padding:6px 10px;font-size:11px;">↻ Refresh</button>
      </div>
      <div class="tableScroll" style="margin-top:8px;"><table id="gradeTable"></table></div>
    </div>

    <!-- Job list: compact rows, edit button each, press-and-hold to reorder -->
    <div id="jobList"></div>
    <div id="jobsEmpty" style="display:none;">No jobs for this day.</div>

    <!-- Scan / upload / manual add — bottom of page, under all jobs -->
    <div class="card" style="margin-top:18px;">
      <h2 style="font-size:12px;margin:0 0 8px 0;font-family:var(--mono);color:var(--dim);">ADD / SCAN NEW JOB</h2>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <input type="file" id="fileInputUpload" accept="image/*">
      <div class="scanBtnRow">
        <button class="primary" id="scanBtn">📷 Take photo</button>
        <button id="uploadBtn">🖼 Upload photo</button>
      </div>
      <button id="manualAddBtn" style="margin-top:8px;">+ Add job manually</button>
      <div id="status"></div>
    </div>

    <div id="reviewList"></div>
    <button class="primary" id="saveAllBtn" style="display:none;">Save all to jobs table</button>

    <details>
      <summary>Dipping memory</summary>
      <div class="card" style="margin-top:8px;">
        <div id="dipMemoryList"></div>
        <div id="dipMemoryEmpty" style="display:none;font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center;padding:10px 0;">Nothing remembered yet — tick Dipping on a job with an item number to start.</div>
      </div>
    </details>

    <button class="danger" id="logoutBtn" style="margin-top:20px;">Sign out</button>
  </div>

</div>

<script>
// ======================================================
// CONFIG
// ======================================================
const SUPABASE_URL = 'https://dcaeetbbufwsbpdhsnhy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WufbIxfaujFYDbxcQgov4A_UWAHcgKn';
// ======================================================

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- Theme toggle ----------
const themeToggle = document.getElementById('themeToggle');
function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  themeToggle.textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';
}
applyTheme(localStorage.getItem('coreCountingTheme') || 'light');
themeToggle.addEventListener('click', ()=>{
  const next = document.body.classList.contains('light') ? 'dark' : 'light';
  localStorage.setItem('coreCountingTheme', next);
  applyTheme(next);
});

// ---------- Radio ----------
const radioBox = document.getElementById('radioBox');
const radioCollapseBtn = document.getElementById('radioCollapseBtn');
const radioUrlInput = document.getElementById('radioUrlInput');
const radioPlayBtn = document.getElementById('radioPlayBtn');
const radioAudio = document.getElementById('radioAudio');

radioUrlInput.value = localStorage.getItem('coreCountingRadioUrl') || 'https://ice1.somafm.com/groovesalad-128-mp3';
if(localStorage.getItem('coreCountingRadioCollapsed') === 'true') radioBox.classList.add('collapsed');

radioCollapseBtn.addEventListener('click', ()=>{
  radioBox.classList.toggle('collapsed');
  localStorage.setItem('coreCountingRadioCollapsed', radioBox.classList.contains('collapsed'));
});

radioPlayBtn.addEventListener('click', ()=>{
  if(radioAudio.paused){
    const url = radioUrlInput.value.trim();
    if(!url) return;
    localStorage.setItem('coreCountingRadioUrl', url);
    if(radioAudio.src !== url) radioAudio.src = url;
    radioAudio.play().catch(err => { radioPlayBtn.textContent = '⚠ ' + err.message; });
    radioPlayBtn.textContent = '⏸ Pause';
  } else {
    radioAudio.pause();
    radioPlayBtn.textContent = '▶ Play';
  }
});

const loginScreen = document.getElementById('loginScreen');
const mainScreen = document.getElementById('mainScreen');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginBtn = document.getElementById('loginBtn');
const loginStatus = document.getElementById('loginStatus');
const logoutBtn = document.getElementById('logoutBtn');
const userEmail = document.getElementById('userEmail');

const jobDatePicker = document.getElementById('jobDatePicker');
const pushLiveBtn = document.getElementById('pushLiveBtn');
const pushLiveLabel = document.getElementById('pushLiveLabel');
const summaryStats = document.getElementById('summaryStats');
const gradeTable = document.getElementById('gradeTable');
const refreshBtn = document.getElementById('refreshBtn');
const jobList = document.getElementById('jobList');
const jobsEmpty = document.getElementById('jobsEmpty');

const fileInput = document.getElementById('fileInput');
const fileInputUpload = document.getElementById('fileInputUpload');
const scanBtn = document.getElementById('scanBtn');
const uploadBtn = document.getElementById('uploadBtn');
const manualAddBtn = document.getElementById('manualAddBtn');
const statusEl = document.getElementById('status');
const reviewList = document.getElementById('reviewList');
const saveAllBtn = document.getElementById('saveAllBtn');

const dipMemoryList = document.getElementById('dipMemoryList');
const dipMemoryEmpty = document.getElementById('dipMemoryEmpty');

jobDatePicker.value = new Date().toISOString().slice(0,10);
jobDatePicker.addEventListener('change', ()=>{ loadJobs(); updatePushLiveButton(); });
refreshBtn.addEventListener('click', ()=>{ loadJobs(); loadDipMemory(); loadPublishedDay(); });

let publishedDay = null;

async function loadPublishedDay(){
  const { data, error } = await supa.from('published_day').select('job_date').eq('id', 1).single();
  publishedDay = error ? null : data.job_date;
  updatePushLiveButton();
}

function updatePushLiveButton(){
  const isLive = publishedDay && jobDatePicker.value === publishedDay;
  pushLiveBtn.classList.toggle('live', isLive);
  pushLiveLabel.textContent = isLive ? 'Live' : 'Push Live';
}

pushLiveBtn.addEventListener('click', async ()=>{
  const selected = jobDatePicker.value || new Date().toISOString().slice(0,10);
  pushLiveLabel.textContent = 'Pushing…';
  const { error } = await supa.from('published_day').update({ job_date: selected, updated_at: new Date().toISOString() }).eq('id', 1);
  if(error){ alert('Failed to push live: ' + error.message); updatePushLiveButton(); return; }
  publishedDay = selected;
  updatePushLiveButton();
});

let extractedJobs = [];
let jobs = [];
let editingIds = new Set();
let draggedId = null;
let pendingReorderWrites = Promise.resolve();
const saveTimers = {};

// ---------- Auth ----------
async function checkSession(){
  const { data: { session } } = await supa.auth.getSession();
  if(session){
    loginScreen.style.display = 'none';
    mainScreen.style.display = 'block';
    userEmail.textContent = session.user.email;
    loadJobs();
    loadDipMemory();
    loadPublishedDay();
  } else {
    loginScreen.style.display = 'block';
    mainScreen.style.display = 'none';
  }
}

loginBtn.addEventListener('click', async ()=>{
  loginStatus.textContent = '';
  const { error } = await supa.auth.signInWithPassword({
    email: loginEmail.value.trim(),
    password: loginPassword.value
  });
  if(error){ loginStatus.textContent = error.message; return; }
  checkSession();
});

logoutBtn.addEventListener('click', async ()=>{
  await supa.auth.signOut();
  checkSession();
});

// ---------- Manual entry ----------
manualAddBtn.addEventListener('click', ()=>{
  extractedJobs.push({
    grade: '', am_number: '', item_number: '', customer_name: '', weight_kg: '',
    planned_qty: '', mingzhi_hansberg_no: '', status: '', is_trial: false, is_doubles: false
  });
  renderReview();
  setStatus('New job added below — fill it in, then Save', 'ok');
});

// ---------- Scan flow ----------
scanBtn.addEventListener('click', ()=> fileInput.click());
uploadBtn.addEventListener('click', ()=> fileInputUpload.click());

fileInput.addEventListener('change', (e)=> handleScanFile(e.target.files[0], fileInput));
fileInputUpload.addEventListener('change', (e)=> handleScanFile(e.target.files[0], fileInputUpload));

async function handleScanFile(file, inputEl){
  if(!file) return;
  setStatus('Reading image…', '');
  try{
    const { base64, mediaType } = await resizeAndEncode(file, 1600);
    setStatus('Sending to Gemini for OCR… this can take 10–20s', '');
    const { data, error: fnError } = await supa.functions.invoke('ocr-plan', {
      body: { imageBase64: base64, mediaType }
    });
    if(fnError){
      setStatus('OCR failed: ' + fnError.message, 'err');
      return;
    }
    if(data.error){
      setStatus('OCR failed: ' + data.error + (data.raw ? (' — raw: ' + data.raw.slice(0,200)) : ''), 'err');
      return;
    }
    extractedJobs = (data.jobs || []).map(j => ({
      grade: j.grade ?? '', am_number: j.am_number ?? '', item_number: j.item_number ?? '',
      customer_name: j.customer_name ?? '', weight_kg: j.weight_kg ?? '', planned_qty: j.planned_qty ?? '',
      mingzhi_hansberg_no: j.mingzhi_hansberg_no ?? '', status: j.status ?? '', is_trial: !!j.is_trial,
      is_doubles: !!j.is_doubles
    }));
    setStatus(extractedJobs.length + ' job(s) extracted — review before saving', 'ok');
    renderReview();
  }catch(err){
    setStatus('Error: ' + err.message, 'err');
  }
  inputEl.value = '';
}

function resizeAndEncode(file, maxDim){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{ img.src = reader.result; };
    reader.onerror = reject;
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        const scale = maxDim / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderReview(){
  reviewList.innerHTML = '';
  extractedJobs.forEach((job, i)=>{
    const card = document.createElement('div');
    card.className = 'jobCard';
    card.innerHTML = `
      <div class="rowTop"><span class="idx">JOB ${i+1}</span><button class="removeBtn" data-i="${i}">✕</button></div>
      <div class="fieldRow">
        <div><label>GRADE</label><input data-i="${i}" data-f="grade" value="${esc(job.grade)}"></div>
        <div><label>AM NUMBER</label><input data-i="${i}" data-f="am_number" value="${esc(job.am_number)}"></div>
      </div>
      <div class="fieldRow">
        <div><label>ITEM NUMBER</label><input data-i="${i}" data-f="item_number" value="${esc(job.item_number)}"></div>
        <div><label>CUSTOMER</label><input data-i="${i}" data-f="customer_name" value="${esc(job.customer_name)}"></div>
      </div>
      <div class="fieldRow">
        <div><label>WEIGHT PER CORE/MOULD (KG)</label><input data-i="${i}" data-f="weight_kg" type="number" step="any" value="${esc(job.weight_kg)}"></div>
        <div><label>PLANNED CORES/MOULDS</label><input data-i="${i}" data-f="planned_qty" type="number" value="${esc(job.planned_qty)}"></div>
      </div>
      <div class="fieldRow">
        <div><label>MINGZHI NO.</label><input data-i="${i}" data-f="mingzhi_hansberg_no" value="${esc(job.mingzhi_hansberg_no)}"></div>
        <div><label>STATUS</label><input data-i="${i}" data-f="status" value="${esc(job.status)}"></div>
      </div>
      <div class="checkboxRow">
        <input type="checkbox" data-i="${i}" data-f="is_trial" id="trial${i}" ${job.is_trial ? 'checked':''}>
        <label for="trial${i}" style="font-size:12px;">Trial job</label>
      </div>
      <div class="checkboxRow">
        <input type="checkbox" data-i="${i}" data-f="is_doubles" id="doubles${i}" ${job.is_doubles ? 'checked':''}>
        <label for="doubles${i}" style="font-size:12px;">Doubles (2 cores per mould)</label>
      </div>
    `;
    reviewList.appendChild(card);
  });

  reviewList.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i = parseInt(inp.dataset.i), f = inp.dataset.f;
      extractedJobs[i][f] = inp.type === 'checkbox' ? inp.checked : inp.value;
    });
  });
  reviewList.querySelectorAll('.removeBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      extractedJobs.splice(parseInt(btn.dataset.i), 1);
      renderReview();
    });
  });

  saveAllBtn.style.display = extractedJobs.length ? 'block' : 'none';
}

saveAllBtn.addEventListener('click', async ()=>{
  if(!extractedJobs.length) return;
  setStatus('Saving…', '');
  const jobDate = jobDatePicker.value || new Date().toISOString().slice(0,10);

  const itemNumbers = extractedJobs.map(j => j.item_number).filter(Boolean);
  let dipMemory = {};
  if(itemNumbers.length){
    const { data: dipRows } = await supa.from('dip_items').select('item_number,needs_dipping').in('item_number', itemNumbers);
    (dipRows || []).forEach(d => { dipMemory[d.item_number] = d.needs_dipping; });
  }

  const rows = extractedJobs.map(j => ({
    grade: j.grade || null,
    am_number: j.am_number || null,
    item_number: j.item_number || null,
    customer_name: j.customer_name || null,
    weight_kg: j.weight_kg === '' ? null : parseFloat(j.weight_kg),
    planned_qty: j.planned_qty === '' ? null : parseInt(j.planned_qty),
    mingzhi_hansberg_no: j.mingzhi_hansberg_no || null,
    status: j.status || null,
    is_trial: !!j.is_trial,
    is_doubles: !!j.is_doubles,
    job_date: jobDate,
    needs_dipping: !!dipMemory[j.item_number]
  })).filter(r => r.am_number); // AM number is the join key, refuse to save without it

  if(rows.length !== extractedJobs.length){
    setStatus('Some rows skipped — AM number is required to save', 'err');
  }

  const { error } = await supa.from('jobs').upsert(rows, { onConflict: 'am_number,job_date' });
  if(error){ setStatus('Save failed: ' + error.message, 'err'); return; }

  setStatus(rows.length + ' job(s) saved', 'ok');
  extractedJobs = [];
  reviewList.innerHTML = '';
  saveAllBtn.style.display = 'none';
  loadJobs();
});

// ---------- Job list: merged Manage + Summary, compact rows ----------
async function loadJobs(){
  await pendingReorderWrites; // let in-flight sort_order writes land first, else stale order re-fetched — see swapAdjacent
  const jobDate = jobDatePicker.value || new Date().toISOString().slice(0,10);
  const { data, error } = await supa.from('job_summary').select('*').eq('job_date', jobDate).order('sort_order', { ascending: true });
  if(error){ jobList.innerHTML = '<div style="color:var(--red);font-family:var(--mono);font-size:12px;">Error: '+esc(error.message)+'</div>'; return; }
  jobs = data || [];
  editingIds = new Set([...editingIds].filter(id => jobs.some(j => j.id === id)));
  renderJobs();
  updateStatsBar();
}

function updateStatsBar(){
  const totalTonnage = jobs.reduce((sum, r) => sum + (r.tonnage || 0), 0);
  const shortCount = jobs.filter(r => r.planned_qty != null && (r.counted_total ?? 0) < r.planned_qty).length;
  const dippingCount = jobs.filter(r => r.needs_dipping).length;
  summaryStats.innerHTML = `
    <div class="statTile neutral"><div class="num">${jobs.length}</div><div class="lbl">Jobs today</div></div>
    <div class="statTile neutral"><div class="num">${totalTonnage.toFixed(1)}t</div><div class="lbl">Total tonnage</div></div>
    <div class="statTile ${shortCount ? 'warn' : 'ok'}"><div class="num">${shortCount}</div><div class="lbl">Short of plan</div></div>
    <div class="statTile ${dippingCount ? 'warn' : 'ok'}"><div class="num">${dippingCount}</div><div class="lbl">Dipping due</div></div>
  `;

  const gradeTotals = {};
  jobs.forEach(r=>{
    const g = r.grade || '(no grade)';
    gradeTotals[g] = (gradeTotals[g] || 0) + (r.tonnage || 0);
  });
  gradeTable.innerHTML = '<tr><th>Grade</th><th>Tonnage</th></tr>' +
    Object.entries(gradeTotals).map(([g,t])=>`<tr><td>${esc(g)}</td><td class="gradeTotal">${t.toFixed(2)} t</td></tr>`).join('');
}

function renderJobs(){
  if(!jobs.length){
    jobList.innerHTML = '';
    jobsEmpty.style.display = 'block';
    return;
  }
  jobsEmpty.style.display = 'none';

  jobList.innerHTML = jobs.map(j=>{
    const planned = j.planned_qty ?? null;
    const counted = j.counted_total ?? 0;
    const moulds = Math.round(j.effective_qty ?? 0);
    const short = planned !== null && counted < planned;
    const editing = editingIds.has(j.id);
    return `
      <div class="jobRow" data-id="${j.id}">
        <div class="jrMain">
          <div class="jrTop">
            <span class="jrAm">${esc(j.am_number)}</span>
            <span class="jrGrade">${esc(j.grade) || '—'}</span>
            ${j.is_trial ? '<span class="badge badge-trial">TRIAL</span>' : ''}
            ${j.still_making ? '<span class="badge badge-warn">MAKING</span>' : ''}
          </div>
          <div class="jrStats">
            <span class="jrCount ${short ? 'jrShort' : 'jrOk'}">${counted}/${moulds}</span>
            <span class="jrTon">${(j.tonnage||0).toFixed(2)}t</span>
            <label class="jrDip"><input type="checkbox" class="dippingCheckbox" data-id="${j.id}" ${j.needs_dipping ? 'checked':''}> dip</label>
          </div>
        </div>
        <button class="editToggleBtn" data-id="${j.id}">${editing ? 'Done' : 'Edit'}</button>
        ${editing ? `
        <div class="editPanel">
          <div class="fieldRow">
            <div><label>GRADE</label><input data-id="${j.id}" data-f="grade" value="${esc(j.grade)}"></div>
            <div><label>AM NUMBER</label><input data-id="${j.id}" data-f="am_number" value="${esc(j.am_number)}"></div>
          </div>
          <div class="fieldRow">
            <div><label>ITEM NUMBER</label><input data-id="${j.id}" data-f="item_number" value="${esc(j.item_number)}"></div>
            <div><label>CUSTOMER</label><input data-id="${j.id}" data-f="customer_name" value="${esc(j.customer_name)}"></div>
          </div>
          <div class="fieldRow">
            <div><label>WEIGHT PER CORE/MOULD (KG)</label><input data-id="${j.id}" data-f="weight_kg" type="number" step="any" value="${esc(j.weight_kg)}"></div>
            <div><label>PLANNED CORES/MOULDS</label><input data-id="${j.id}" data-f="planned_qty" type="number" value="${esc(j.planned_qty)}"></div>
          </div>
          <div class="fieldRow">
            <div><label>MINGZHI NO.</label><input data-id="${j.id}" data-f="mingzhi_hansberg_no" value="${esc(j.mingzhi_hansberg_no)}"></div>
            <div><label>STATUS</label><input data-id="${j.id}" data-f="status" value="${esc(j.status)}"></div>
          </div>
          <div class="checkboxRow">
            <input type="checkbox" data-id="${j.id}" data-f="is_trial" id="editTrial${j.id}" ${j.is_trial ? 'checked':''}>
            <label for="editTrial${j.id}" style="font-size:12px;">Trial job</label>
          </div>
          <div class="checkboxRow">
            <input type="checkbox" data-id="${j.id}" data-f="is_doubles" id="editDoubles${j.id}" ${j.is_doubles ? 'checked':''}>
            <label for="editDoubles${j.id}" style="font-size:12px;">Doubles (2 cores per mould)</label>
          </div>
          ${j.comment ? `<div class="jrComment">"${esc(j.comment)}"</div>` : ''}
          <div class="manageSaveState" data-savestate="${j.id}"></div>
          <button class="danger deleteJobBtn" data-id="${j.id}" style="margin-top:10px;">Delete job</button>
        </div>` : ''}
      </div>`;
  }).join('');
}

// Delegated listeners — bound once, never re-bound on render.
jobList.addEventListener('input', (e)=>{
  const inp = e.target.closest('input[data-f]');
  if(!inp || inp.type === 'checkbox') return;
  const job = jobs.find(j => j.id === inp.dataset.id);
  if(!job) return;
  job[inp.dataset.f] = inp.value;
  queueSave(inp.dataset.id, inp.dataset.f, inp.value);
});

jobList.addEventListener('change', (e)=>{
  const cb = e.target.closest('input[type="checkbox"][data-f]');
  if(cb){
    const job = jobs.find(j => j.id === cb.dataset.id);
    if(job){ job[cb.dataset.f] = cb.checked; queueSave(cb.dataset.id, cb.dataset.f, cb.checked); }
    return;
  }
  const dip = e.target.closest('.dippingCheckbox');
  if(dip) handleDippingToggle(dip);
});

jobList.addEventListener('click', async (e)=>{
  const editBtn = e.target.closest('.editToggleBtn');
  if(editBtn){
    const id = editBtn.dataset.id;
    if(editingIds.has(id)) editingIds.delete(id); else editingIds.add(id);
    renderJobs();
    return;
  }
  const delBtn = e.target.closest('.deleteJobBtn');
  if(delBtn){
    const id = delBtn.dataset.id;
    const job = jobs.find(j => j.id === id);
    if(!confirm(`Delete job ${job.am_number}? This also removes its trolley count. Cannot be undone.`)) return;
    const { error } = await supa.from('jobs').delete().eq('id', id);
    if(error){ alert('Delete failed: ' + error.message); return; }
    jobs = jobs.filter(j => j.id !== id);
    editingIds.delete(id);
    renderJobs();
    updateStatsBar();
  }
});

async function handleDippingToggle(cb){
  const id = cb.dataset.id;
  const { error } = await supa.from('jobs').update({ needs_dipping: cb.checked }).eq('id', id);
  if(error){ alert('Failed to update dipping flag: ' + error.message); cb.checked = !cb.checked; return; }
  const job = jobs.find(j => j.id === id);
  if(job) job.needs_dipping = cb.checked;
  updateStatsBar();
  if(cb.checked && job && job.item_number){
    await supa.from('dip_items').upsert(
      { item_number: job.item_number, needs_dipping: true, updated_at: new Date().toISOString() },
      { onConflict: 'item_number' }
    );
  }
}

function queueSave(id, field, value){
  const stateEl = jobList.querySelector(`.manageSaveState[data-savestate="${id}"]`);
  if(stateEl){ stateEl.textContent = 'unsaved…'; stateEl.className = 'manageSaveState'; }

  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(async ()=>{
    const job = jobs.find(j => j.id === id);
    if(!job) return;
    const patch = {};
    patch[field] = (field === 'weight_kg') ? (job[field] === '' ? null : parseFloat(job[field]))
      : (field === 'planned_qty') ? (job[field] === '' ? null : parseInt(job[field]))
      : job[field];
    const { error } = await supa.from('jobs').update(patch).eq('id', id);
    const el = jobList.querySelector(`.manageSaveState[data-savestate="${id}"]`);
    if(el){
      if(error){ el.textContent = 'save failed: ' + error.message; el.style.color = 'var(--red)'; }
      else { el.textContent = 'saved'; el.className = 'manageSaveState saved'; }
    }
    if(!error && (field === 'weight_kg' || field === 'planned_qty' || field === 'is_doubles')){
      refreshRowMetrics(id);
    }
  }, 500);
}

// Re-fetch just the computed columns for one row after an edit that affects tonnage/counts,
// and patch the DOM in place so the open edit panel / focus isn't disturbed by a full re-render.
async function refreshRowMetrics(id){
  const { data } = await supa.from('job_summary').select('tonnage,counted_total,effective_qty,planned_qty').eq('id', id).single();
  if(!data) return;
  const job = jobs.find(j => j.id === id);
  if(!job) return;
  Object.assign(job, data);
  updateStatsBar();
  const row = jobList.querySelector(`.jobRow[data-id="${id}"]`);
  if(!row) return;
  const planned = job.planned_qty ?? null;
  const counted = job.counted_total ?? 0;
  const moulds = Math.round(job.effective_qty ?? 0);
  const short = planned !== null && counted < planned;
  const countEl = row.querySelector('.jrCount');
  if(countEl){ countEl.textContent = counted + '/' + moulds; countEl.className = 'jrCount ' + (short ? 'jrShort' : 'jrOk'); }
  const tonEl = row.querySelector('.jrTon');
  if(tonEl) tonEl.textContent = (job.tonnage||0).toFixed(2) + 't';
}

// ---------- Press-and-hold reorder ----------
jobList.addEventListener('pointerdown', (e)=>{
  if(e.target.closest('button, input, select, textarea, a, label')) return;
  const row = e.target.closest('.jobRow');
  if(!row) return;
  startDrag(row, e);
});

function startDrag(row, e){
  const id = row.dataset.id;
  const startX = e.clientX, startY = e.clientY;
  let holding = false;
  let scrolling = false; // true once we've decided this touch is a page-scroll, not a hold
  let lastY = e.clientY;

  // .jobRow is touch-action:none in CSS (must be static — the browser decides scroll-vs-not
  // at touchstart, before any JS runs, so toggling this reactively here would be too late).
  // That means native scroll never engages on a row; we drive scrolling ourselves below
  // whenever a touch here turns out to be a swipe rather than a hold.
  const holdTimer = setTimeout(()=>{
    if(scrolling) return;
    holding = true;
    draggedId = id;
    row.classList.add('dragging');
  }, 500);

  function onMove(ev){
    if(scrolling){
      window.scrollBy(0, lastY - ev.clientY);
      lastY = ev.clientY;
      return;
    }
    if(!holding){
      if(Math.abs(ev.clientX - startX) > 8 || Math.abs(ev.clientY - startY) > 8){
        clearTimeout(holdTimer);
        scrolling = true;
        lastY = ev.clientY;
      }
      return;
    }
    ev.preventDefault();
    const idx = jobs.findIndex(j => j.id === draggedId);
    if(idx < 0) return;
    const rows = [...jobList.querySelectorAll('.jobRow')];
    const y = ev.clientY;
    if(idx > 0){
      const prevRect = rows[idx-1].getBoundingClientRect();
      if(y < prevRect.top + prevRect.height/2){ swapAdjacent(idx-1, idx); return; }
    }
    if(idx < jobs.length - 1){
      const nextRect = rows[idx+1].getBoundingClientRect();
      if(y > nextRect.top + nextRect.height/2){ swapAdjacent(idx, idx+1); }
    }
  }
  function onUp(){
    clearTimeout(holdTimer);
    holding = false;
    scrolling = false;
    draggedId = null;
    cleanup();
    const r = jobList.querySelector(`.jobRow[data-id="${id}"]`);
    if(r) r.classList.remove('dragging');
  }
  function cleanup(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

// Same primitive as the old up/down buttons: swap two ADJACENT rows' sort_order.
// sort_order spacing never matters, only relative order — see CLAUDE.md.
function swapAdjacent(i, j){
  [jobs[i], jobs[j]] = [jobs[j], jobs[i]];
  renderJobs();
  const row = jobList.querySelector(`.jobRow[data-id="${draggedId}"]`);
  if(row) row.classList.add('dragging');
  renumberAndPersist();
}

// Reassign every job's sort_order to base+index (base = current min), then persist only the
// rows whose value actually changed. Swapping two rows' raw values isn't enough: jobs scanned
// in the same OCR batch can share the same whole-second epoch sort_order, so a plain swap of
// tied values is a no-op on the server even though the UI shows the new order — the next
// refresh then reverts it. Full renumbering makes every value distinct, so ties can't survive
// a drag; after the first renumber, later swaps only touch the two rows that actually moved.
function renumberAndPersist(){
  const base = Math.min(...jobs.map(j => j.sort_order));
  const updates = [];
  jobs.forEach((j, k) => {
    const val = base + k;
    if(j.sort_order !== val){ j.sort_order = val; updates.push({ id: j.id, sort_order: val }); }
  });
  if(!updates.length) return;
  pendingReorderWrites = pendingReorderWrites.then(() => Promise.all(
    updates.map(u => supa.from('jobs').update({ sort_order: u.sort_order }).eq('id', u.id))
  ));
}

// ---------- Dipping memory ----------
async function loadDipMemory(){
  const { data, error } = await supa.from('dip_items').select('*').order('item_number');
  if(error){ dipMemoryList.innerHTML = '<div style="color:var(--red);font-family:var(--mono);font-size:12px;">Error: '+esc(error.message)+'</div>'; return; }
  const items = data || [];
  if(!items.length){
    dipMemoryList.innerHTML = '';
    dipMemoryEmpty.style.display = 'block';
    return;
  }
  dipMemoryEmpty.style.display = 'none';
  dipMemoryList.innerHTML = items.map(d => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;">
      <span>${esc(d.item_number)}</span>
      <button class="removeBtn dipMemoryDeleteBtn" data-item="${esc(d.item_number)}">✕</button>
    </div>
  `).join('');
}

dipMemoryList.addEventListener('click', async (e)=>{
  const btn = e.target.closest('.dipMemoryDeleteBtn');
  if(!btn) return;
  const { error } = await supa.from('dip_items').delete().eq('item_number', btn.dataset.item);
  if(error){ alert('Failed to remove: ' + error.message); return; }
  loadDipMemory();
});

function esc(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}
function setStatus(msg, cls){
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}

checkSession();
</script>
