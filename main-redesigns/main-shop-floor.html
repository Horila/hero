<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Core Counting — Shop Floor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* =========================================================
     SHOP FLOOR MODE
     Big numbers, big buttons, minimal text, glove-friendly.
     Every tappable control >= 56px tall. Status = filled chips,
     never thin colored text.
  ========================================================= */
  :root{
    --bg:#0a0b08;
    --panel:#15170f;
    --panel2:#1c1f14;
    --elev:#20240f;
    --line:#3a3f27;
    --line-strong:#565c37;
    --text:#f7f5ea;
    --dim:#a6a68e;
    --dim2:#767a5f;

    --amber:#ff9f0a;
    --amber-strong:#ffb635;
    --amber-ink:#2a1600;
    --amber-bg:rgba(255,159,10,.16);

    --green:#2fd35c;
    --green-ink:#03210c;
    --green-bg:rgba(47,211,92,.16);

    --red:#ff4b3e;
    --red-ink:#2b0705;
    --red-bg:rgba(255,75,62,.16);

    --tap:56px;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 3px 14px rgba(0,0,0,.45);
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'SF Mono','Consolas','Courier New',ui-monospace,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%;}
  body{-webkit-font-smoothing:antialiased;}
  #app{max-width:720px;margin:0 auto;padding:12px 14px calc(48px + env(safe-area-inset-bottom)) 14px;}

  h1{font-size:26px;font-weight:900;margin:0;letter-spacing:-.01em;}
  h2{font-size:15px;font-weight:800;margin:0 0 10px 0;letter-spacing:.02em;text-transform:uppercase;color:var(--dim);}
  .subtitle{font-size:14px;color:var(--dim);font-weight:600;}

  .card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}

  /* ---- Inputs: big, glove-friendly ---- */
  input, select{
    width:100%;min-height:var(--tap);padding:12px 14px;border-radius:var(--radius-sm);
    border:2px solid var(--line);background:var(--elev);color:var(--text);
    font-family:var(--sans);font-size:17px;font-weight:600;margin-top:6px;
  }
  input:focus, select:focus{outline:none;border-color:var(--amber);}
  input[type="file"]{display:none;}
  label{font-size:11.5px;color:var(--dim);font-weight:800;display:block;margin-top:12px;letter-spacing:.05em;text-transform:uppercase;}
  label:first-child{margin-top:0;}

  /* ---- Buttons: every one at least 56px tall ---- */
  button{
    font-family:var(--sans);font-weight:800;font-size:16px;min-height:var(--tap);
    padding:12px 16px;border-radius:var(--radius-sm);border:2px solid var(--line-strong);
    background:var(--panel2);color:var(--text);cursor:pointer;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .08s,opacity .08s; letter-spacing:.01em;
  }
  button.primary{
    background:var(--amber);border-color:var(--amber);color:var(--amber-ink);
    font-size:18px;min-height:64px;box-shadow:0 4px 0 0 #a85c00, var(--shadow);
    text-transform:uppercase;
  }
  button.danger{background:transparent;border:2px solid var(--red);color:var(--red);}
  button:active{transform:translateY(1px) scale(.99);opacity:.9;}
  button.primary:active{box-shadow:0 2px 0 0 #a85c00;}
  button:disabled{opacity:.35;}

  /* ---- Top bar ---- */
  .topBar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;background:rgba(10,11,8,.92);backdrop-filter:blur(10px);
    border-bottom:2px solid var(--line);margin:0 -14px 12px -14px;
  }
  body.light .topBar{background:rgba(250,248,240,.92);}
  .topBar .brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;letter-spacing:-.01em;}
  .topBar .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);}
  #themeToggle{width:auto;min-height:48px;padding:0 14px;font-size:13px;}

  /* ---- Segmented tabs: three big blocks ---- */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .tabs button{min-height:64px;border-radius:var(--radius-sm);background:var(--panel2);border:2px solid var(--line-strong);color:var(--dim);font-size:14px;flex-direction:column;gap:2px;}
  .tabs button .tabIcon{font-size:22px;line-height:1;}
  .tabs button.active{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);box-shadow:var(--shadow);}

  /* ---- Stat tiles: huge numerals, status = filled chip ---- */
  .statRow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
  @media (min-width:480px){ .statRow{grid-template-columns:repeat(4,1fr);} }
  .statTile{border:2px solid var(--line-strong);border-radius:var(--radius);padding:16px 10px;text-align:center;background:var(--panel2);box-shadow:var(--shadow);}
  .statTile .num{font-family:var(--mono);font-size:38px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
  .statTile .lbl{font-size:11px;font-weight:800;color:inherit;opacity:.85;letter-spacing:.04em;margin-top:6px;text-transform:uppercase;}
  .statTile.neutral{border-color:var(--amber);}
  .statTile.neutral .num{color:var(--amber);}
  .statTile.ok{background:var(--green);border-color:var(--green);}
  .statTile.ok .num, .statTile.ok .lbl{color:var(--green-ink);}
  .statTile.warn{background:var(--red);border-color:var(--red);}
  .statTile.warn .num, .statTile.warn .lbl{color:var(--red-ink);}

  /* ---- Job cards (scan review + manage) ---- */
  .jobCard{border:2px solid var(--line-strong);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--panel2);}
  .jobCard .fieldRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:420px){ .jobCard .fieldRow{grid-template-columns:1fr;} }
  .jobCard label{margin-top:10px;}
  .rowTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .rowTop .idx{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--amber-ink);background:var(--amber);padding:5px 11px;border-radius:999px;letter-spacing:.03em;}
  .removeBtn{background:var(--panel);border:2px solid var(--red);color:var(--red);font-size:20px;font-weight:900;width:56px;min-height:56px;padding:0;flex:none;}
  .reorderBtn{background:var(--elev);border:2px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--text);font-size:20px;width:56px;min-height:56px;padding:0;flex:none;}
  .reorderBtn:disabled{opacity:.3;}
  .manageSaveState{font-family:var(--mono);font-size:11px;font-weight:800;text-align:right;margin-top:8px;height:14px;text-transform:uppercase;letter-spacing:.04em;}
  .manageSaveState:not(:empty){display:inline-block;float:right;padding:5px 12px;border-radius:999px;background:var(--amber-bg);color:var(--amber-strong);}
  .manageSaveState.saved:not(:empty){background:var(--green-bg);color:var(--green);}

  /* ---- Tables ---- */
  .tableScroll{overflow-x:auto;max-width:100%;border-radius:var(--radius-sm);}
  table{width:100%;min-width:400px;border-collapse:collapse;font-size:15px;}
  th,td{text-align:left;padding:12px 10px;border-bottom:2px solid var(--line);font-weight:700;white-space:nowrap;}
  th{color:var(--dim);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--panel);}
  tbody tr:nth-child(even){background:rgba(255,255,255,.03);}
  body.light tbody tr:nth-child(even){background:rgba(0,0,0,.03);}
  .gradeTotal{font-weight:900;color:var(--amber);font-size:16px;}

  /* ---- Badges: filled, unambiguous ---- */
  .badge{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.03em;padding:5px 10px;border-radius:6px;white-space:nowrap;text-transform:uppercase;}
  .badge-warn{background:var(--red);color:var(--red-ink);}
  .badge-trial{background:var(--amber);color:var(--amber-ink);}

  /* ---- Summary job cards ---- */
  .summaryJobCard{border:2px solid var(--line-strong);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--panel2);}
  .summaryJobCard .sjHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;}
  .summaryJobCard .sjAm{font-family:var(--mono);font-weight:900;color:var(--amber);font-size:22px;}
  .summaryJobCard .sjTonnage{font-family:var(--mono);font-weight:800;font-size:17px;}
  .summaryJobCard .sjSub{font-size:13px;color:var(--dim);font-weight:700;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .summaryJobCard .sjMetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .summaryJobCard .sjMetric{background:var(--elev);border-radius:var(--radius-sm);padding:10px 6px;text-align:center;}
  .summaryJobCard .sjMetric .v{font-family:var(--mono);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;}
  .summaryJobCard .sjMetric .k{font-size:9.5px;font-weight:800;color:var(--dim);letter-spacing:.03em;text-transform:uppercase;margin-top:4px;}
  .summaryJobCard .sjFoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:2px solid var(--line);}
  .summaryJobCard .sjDipRow{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--text);min-height:var(--tap);width:100%;}
  .summaryJobCard .sjComment{font-size:14px;color:var(--dim);margin-top:10px;font-style:italic;}

  #status{font-size:14px;font-weight:700;color:var(--dim);margin:12px 0;min-height:20px;}
  #status.err{color:var(--red);}
  #status.ok{color:var(--green);}

  /* ---- Checkbox rows: whole row is the >=56px tap target ---- */
  .checkboxRow{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:var(--tap);
    background:var(--elev);border:2px solid var(--line);border-radius:var(--radius-sm);padding:0 14px;}
  .checkboxRow input{width:26px;height:26px;margin:0;accent-color:var(--amber);flex:none;}
  .checkboxRow label{margin:0;font-size:15px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--text);}
  .dippingCheckbox{width:26px !important;height:26px;margin:0;accent-color:var(--amber);flex:none;}

  #loginScreen, #mainScreen{display:none;}

  .scanBtnRow{display:flex;gap:8px;}
  .scanBtnRow button{flex:1;}

  body.light{
    --bg:#f6f3e8; --panel:#ffffff; --panel2:#f1ecdc; --elev:#ffffff;
    --line:#ddd3b8; --line-strong:#c7bb96;
    --text:#20200f; --dim:#6b6650; --dim2:#948a6c;
    --amber-bg:rgba(255,159,10,.14);
    --green-bg:rgba(47,211,92,.14);
    --red-bg:rgba(255,75,62,.14);
  }

  #radioBox{
    position:fixed;bottom:10px;right:10px;z-index:10;background:var(--panel);
    border:2px solid var(--line);border-radius:var(--radius-sm);padding:8px;width:168px;
    box-shadow:var(--shadow);opacity:.9;
  }
  #radioBox .radioHead{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:4px;}
  #radioBox .radioTitle{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.03em;}
  #radioCollapseBtn{width:auto;min-height:36px;padding:0 8px;font-size:12px;background:transparent;border:none;color:var(--dim);}
  #radioBox.collapsed .radioBody{display:none;}
  #radioPlayBtn{width:100%;margin-top:4px;min-height:44px;font-size:12px;}
  #radioUrlInput{font-size:11px;min-height:36px;padding:6px;margin-top:0;}
</style>
</head>
<body>
<div id="app">

<div class="topBar">
  <div class="brand"><span class="dot"></span>CORE COUNT</div>
  <button id="themeToggle">🌙</button>
</div>

<div id="radioBox">
  <div class="radioHead">
    <span class="radioTitle">📻 RADIO</span>
    <button id="radioCollapseBtn">▁</button>
  </div>
  <div class="radioBody">
    <input type="text" id="radioUrlInput" placeholder="stream URL">
    <button id="radioPlayBtn">▶ Play</button>
  </div>
  <audio id="radioAudio" preload="none"></audio>
</div>

  <!-- ============ LOGIN ============ -->
  <div id="loginScreen">
    <h1 style="margin-top:10px;">Sign in</h1>
    <div class="subtitle" style="margin:6px 0 16px;">Horatio's admin page</div>
    <div class="card">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username">
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
      <button class="primary" id="loginBtn" style="margin-top:16px;">Sign in</button>
      <div id="loginStatus" style="font-size:14px;font-weight:700;color:var(--red);margin-top:10px;"></div>
    </div>
  </div>

  <!-- ============ MAIN APP ============ -->
  <div id="mainScreen">
    <div class="subtitle" id="userEmail" style="margin-bottom:12px;"></div>

    <div class="tabs">
      <button id="tabScanBtn" class="active"><span class="tabIcon">📷</span>Scan</button>
      <button id="tabManageBtn"><span class="tabIcon">🛠</span>Manage</button>
      <button id="tabSummaryBtn"><span class="tabIcon">📋</span>Summary</button>
    </div>

    <div class="card" style="padding:12px;">
      <label>Day</label>
      <input type="date" id="jobDatePicker">
    </div>

    <!-- SCAN TAB -->
    <div id="scanTab">
      <div class="card">
        <input type="file" id="fileInput" accept="image/*" capture="environment">
        <input type="file" id="fileInputUpload" accept="image/*">
        <div class="scanBtnRow">
          <button class="primary" id="scanBtn">📷 Photo</button>
          <button id="uploadBtn">🖼 Upload</button>
        </div>
        <button id="manualAddBtn" style="margin-top:10px;">+ Add job</button>
        <div id="status"></div>
      </div>

      <div id="reviewList"></div>

      <button class="primary" id="saveAllBtn" style="display:none;">✓ Save all jobs</button>
    </div>

    <!-- MANAGE TAB -->
    <div id="manageTab" style="display:none;">
      <div class="card">
        <button id="refreshManageBtn">↻ Refresh</button>
      </div>
      <div id="manageList"></div>
      <div id="manageEmpty" style="display:none;font-size:15px;font-weight:700;color:var(--dim);text-align:center;padding:24px 0;">No jobs for this day.</div>

      <div class="card">
        <h2>Dipping memory</h2>
        <div id="dipMemoryList"></div>
        <div id="dipMemoryEmpty" style="display:none;font-size:14px;font-weight:600;color:var(--dim);text-align:center;padding:10px 0;">Nothing remembered yet.</div>
      </div>
    </div>

    <!-- SUMMARY TAB -->
    <div id="summaryTab" style="display:none;">
      <div class="card" style="padding:12px;">
        <button id="refreshSummaryBtn">↻ Refresh</button>
      </div>

      <div class="statRow" id="summaryStats"></div>

      <div class="card">
        <h2>Tonnage by grade</h2>
        <div class="tableScroll"><table id="gradeTable"></table></div>
      </div>
      <div class="card">
        <h2>Jobs</h2>
        <div id="jobsTable"></div>
      </div>
    </div>

    <button class="danger" id="logoutBtn" style="margin-top:20px;">Sign out</button>
  </div>

</div>
<script>
// ======================================================
// CONFIG — fill these in after creating your Supabase project
// Dashboard → Project Settings → API
// ======================================================
const SUPABASE_URL = 'https://dcaeetbbufwsbpdhsnhy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WufbIxfaujFYDbxcQgov4A_UWAHcgKn';
// ======================================================

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- Theme toggle ----------
const themeToggle = document.getElementById('themeToggle');
function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  themeToggle.textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';
}
applyTheme(localStorage.getItem('coreCountingTheme') || 'dark');
themeToggle.addEventListener('click', ()=>{
  const next = document.body.classList.contains('light') ? 'dark' : 'light';
  localStorage.setItem('coreCountingTheme', next);
  applyTheme(next);
});

// ---------- Radio ----------
const radioBox = document.getElementById('radioBox');
const radioCollapseBtn = document.getElementById('radioCollapseBtn');
const radioUrlInput = document.getElementById('radioUrlInput');
const radioPlayBtn = document.getElementById('radioPlayBtn');
const radioAudio = document.getElementById('radioAudio');

radioUrlInput.value = localStorage.getItem('coreCountingRadioUrl') || 'https://ice1.somafm.com/groovesalad-128-mp3';
if(localStorage.getItem('coreCountingRadioCollapsed') === 'true') radioBox.classList.add('collapsed');

radioCollapseBtn.addEventListener('click', ()=>{
  radioBox.classList.toggle('collapsed');
  localStorage.setItem('coreCountingRadioCollapsed', radioBox.classList.contains('collapsed'));
});

radioPlayBtn.addEventListener('click', ()=>{
  if(radioAudio.paused){
    const url = radioUrlInput.value.trim();
    if(!url) return;
    localStorage.setItem('coreCountingRadioUrl', url);
    if(radioAudio.src !== url) radioAudio.src = url;
    radioAudio.play().catch(err => { radioPlayBtn.textContent = '⚠ ' + err.message; });
    radioPlayBtn.textContent = '⏸ Pause';
  } else {
    radioAudio.pause();
    radioPlayBtn.textContent = '▶ Play';
  }
});

const loginScreen = document.getElementById('loginScreen');
const mainScreen = document.getElementById('mainScreen');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginBtn = document.getElementById('loginBtn');
const loginStatus = document.getElementById('loginStatus');
const logoutBtn = document.getElementById('logoutBtn');
const userEmail = document.getElementById('userEmail');

const tabScanBtn = document.getElementById('tabScanBtn');
const tabManageBtn = document.getElementById('tabManageBtn');
const tabSummaryBtn = document.getElementById('tabSummaryBtn');
const scanTab = document.getElementById('scanTab');
const manageTab = document.getElementById('manageTab');
const summaryTab = document.getElementById('summaryTab');
const refreshManageBtn = document.getElementById('refreshManageBtn');
const manageList = document.getElementById('manageList');
const manageEmpty = document.getElementById('manageEmpty');
const dipMemoryList = document.getElementById('dipMemoryList');
const dipMemoryEmpty = document.getElementById('dipMemoryEmpty');

const fileInput = document.getElementById('fileInput');
const fileInputUpload = document.getElementById('fileInputUpload');
const scanBtn = document.getElementById('scanBtn');
const uploadBtn = document.getElementById('uploadBtn');
const manualAddBtn = document.getElementById('manualAddBtn');
const statusEl = document.getElementById('status');
const reviewList = document.getElementById('reviewList');
const saveAllBtn = document.getElementById('saveAllBtn');

const refreshSummaryBtn = document.getElementById('refreshSummaryBtn');
const gradeTable = document.getElementById('gradeTable');
const jobsTable = document.getElementById('jobsTable');
const summaryStats = document.getElementById('summaryStats');

const jobDatePicker = document.getElementById('jobDatePicker');
jobDatePicker.value = new Date().toISOString().slice(0,10);
jobDatePicker.addEventListener('change', ()=>{
  if(summaryTab.style.display !== 'none') loadSummary();
  if(manageTab.style.display !== 'none') loadManageJobs();
});

let extractedJobs = [];

// ---------- Auth ----------
async function checkSession(){
  const { data: { session } } = await supa.auth.getSession();
  if(session){
    loginScreen.style.display = 'none';
    mainScreen.style.display = 'block';
    userEmail.textContent = session.user.email;
    loadSummary();
  } else {
    loginScreen.style.display = 'block';
    mainScreen.style.display = 'none';
  }
}

loginBtn.addEventListener('click', async ()=>{
  loginStatus.textContent = '';
  const { error } = await supa.auth.signInWithPassword({
    email: loginEmail.value.trim(),
    password: loginPassword.value
  });
  if(error){ loginStatus.textContent = error.message; return; }
  checkSession();
});

logoutBtn.addEventListener('click', async ()=>{
  await supa.auth.signOut();
  checkSession();
});

// ---------- Tabs ----------
function showTab(tab){
  tabScanBtn.classList.toggle('active', tab === 'scan');
  tabManageBtn.classList.toggle('active', tab === 'manage');
  tabSummaryBtn.classList.toggle('active', tab === 'summary');
  scanTab.style.display = tab === 'scan' ? 'block' : 'none';
  manageTab.style.display = tab === 'manage' ? 'block' : 'none';
  summaryTab.style.display = tab === 'summary' ? 'block' : 'none';
}
tabScanBtn.addEventListener('click', ()=> showTab('scan'));
tabManageBtn.addEventListener('click', ()=>{ showTab('manage'); loadManageJobs(); loadDipMemory(); });
tabSummaryBtn.addEventListener('click', ()=>{ showTab('summary'); loadSummary(); });

// ---------- Manual entry ----------
manualAddBtn.addEventListener('click', ()=>{
  extractedJobs.push({
    grade: '', am_number: '', item_number: '', customer_name: '', weight_kg: '',
    planned_qty: '', mingzhi_hansberg_no: '', status: '', is_trial: false, is_doubles: false
  });
  renderReview();
  setStatus('New job added below — fill it in, then Save', 'ok');
});

// ---------- Scan flow ----------
scanBtn.addEventListener('click', ()=> fileInput.click());
uploadBtn.addEventListener('click', ()=> fileInputUpload.click());

fileInput.addEventListener('change', (e)=> handleScanFile(e.target.files[0], fileInput));
fileInputUpload.addEventListener('change', (e)=> handleScanFile(e.target.files[0], fileInputUpload));

async function handleScanFile(file, inputEl){
  if(!file) return;
  setStatus('Reading image…', '');
  try{
    const { base64, mediaType } = await resizeAndEncode(file, 1600);
    setStatus('Sending to Gemini for OCR… this can take 10–20s', '');
    const { data, error: fnError } = await supa.functions.invoke('ocr-plan', {
      body: { imageBase64: base64, mediaType }
    });
    if(fnError){
      setStatus('OCR failed: ' + fnError.message, 'err');
      return;
    }
    if(data.error){
      setStatus('OCR failed: ' + data.error + (data.raw ? (' — raw: ' + data.raw.slice(0,200)) : ''), 'err');
      return;
    }
    extractedJobs = (data.jobs || []).map(j => ({
      grade: j.grade ?? '', am_number: j.am_number ?? '', item_number: j.item_number ?? '',
      customer_name: j.customer_name ?? '', weight_kg: j.weight_kg ?? '', planned_qty: j.planned_qty ?? '',
      mingzhi_hansberg_no: j.mingzhi_hansberg_no ?? '', status: j.status ?? '', is_trial: !!j.is_trial,
      is_doubles: !!j.is_doubles
    }));
    setStatus(extractedJobs.length + ' job(s) extracted — review before saving', 'ok');
    renderReview();
  }catch(err){
    setStatus('Error: ' + err.message, 'err');
  }
  inputEl.value = '';
}

function resizeAndEncode(file, maxDim){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{ img.src = reader.result; };
    reader.onerror = reject;
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        const scale = maxDim / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderReview(){
  reviewList.innerHTML = '';
  extractedJobs.forEach((job, i)=>{
    const card = document.createElement('div');
    card.className = 'jobCard';
    card.innerHTML = `
      <div class="rowTop"><span class="idx">JOB ${i+1}</span><button class="removeBtn" data-i="${i}">✕</button></div>
      <div class="fieldRow">
        <div><label>GRADE</label><input data-i="${i}" data-f="grade" value="${esc(job.grade)}"></div>
        <div><label>AM NUMBER</label><input data-i="${i}" data-f="am_number" value="${esc(job.am_number)}"></div>
      </div>
      <div class="fieldRow">
        <div><label>ITEM NUMBER</label><input data-i="${i}" data-f="item_number" value="${esc(job.item_number)}"></div>
        <div><label>CUSTOMER</label><input data-i="${i}" data-f="customer_name" value="${esc(job.customer_name)}"></div>
      </div>
      <div class="fieldRow">
        <div><label>WEIGHT PER CORE/MOULD (KG)</label><input data-i="${i}" data-f="weight_kg" type="number" step="any" value="${esc(job.weight_kg)}"></div>
        <div><label>PLANNED CORES/MOULDS</label><input data-i="${i}" data-f="planned_qty" type="number" value="${esc(job.planned_qty)}"></div>
      </div>
      <div class="fieldRow">
        <div><label>MINGZHI/HANSBERG NO.</label><input data-i="${i}" data-f="mingzhi_hansberg_no" value="${esc(job.mingzhi_hansberg_no)}"></div>
        <div><label>STATUS</label><input data-i="${i}" data-f="status" value="${esc(job.status)}"></div>
      </div>
      <div class="checkboxRow">
        <input type="checkbox" data-i="${i}" data-f="is_trial" id="trial${i}" ${job.is_trial ? 'checked':''}>
        <label for="trial${i}" style="font-size:12px;">Trial job</label>
      </div>
      <div class="checkboxRow">
        <input type="checkbox" data-i="${i}" data-f="is_doubles" id="doubles${i}" ${job.is_doubles ? 'checked':''}>
        <label for="doubles${i}" style="font-size:12px;">Doubles (2 cores per mould)</label>
      </div>
    `;
    reviewList.appendChild(card);
  });

  reviewList.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i = parseInt(inp.dataset.i), f = inp.dataset.f;
      extractedJobs[i][f] = inp.type === 'checkbox' ? inp.checked : inp.value;
    });
  });
  reviewList.querySelectorAll('.removeBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      extractedJobs.splice(parseInt(btn.dataset.i), 1);
      renderReview();
    });
  });

  saveAllBtn.style.display = extractedJobs.length ? 'block' : 'none';
}

saveAllBtn.addEventListener('click', async ()=>{
  if(!extractedJobs.length) return;
  setStatus('Saving…', '');
  const jobDate = jobDatePicker.value || new Date().toISOString().slice(0,10);

  const itemNumbers = extractedJobs.map(j => j.item_number).filter(Boolean);
  let dipMemory = {};
  if(itemNumbers.length){
    const { data: dipRows } = await supa.from('dip_items').select('item_number,needs_dipping').in('item_number', itemNumbers);
    (dipRows || []).forEach(d => { dipMemory[d.item_number] = d.needs_dipping; });
  }

  const rows = extractedJobs.map(j => ({
    grade: j.grade || null,
    am_number: j.am_number || null,
    item_number: j.item_number || null,
    customer_name: j.customer_name || null,
    weight_kg: j.weight_kg === '' ? null : parseFloat(j.weight_kg),
    planned_qty: j.planned_qty === '' ? null : parseInt(j.planned_qty),
    mingzhi_hansberg_no: j.mingzhi_hansberg_no || null,
    status: j.status || null,
    is_trial: !!j.is_trial,
    is_doubles: !!j.is_doubles,
    job_date: jobDate,
    needs_dipping: !!dipMemory[j.item_number]
  })).filter(r => r.am_number); // AM number is the join key, refuse to save without it

  if(rows.length !== extractedJobs.length){
    setStatus('Some rows skipped — AM number is required to save', 'err');
  }

  const { error } = await supa.from('jobs').upsert(rows, { onConflict: 'am_number,job_date' });
  if(error){ setStatus('Save failed: ' + error.message, 'err'); return; }

  setStatus(rows.length + ' job(s) saved', 'ok');
  extractedJobs = [];
  reviewList.innerHTML = '';
  saveAllBtn.style.display = 'none';
});

// ---------- Manage Jobs (edit / delete / reorder) ----------
let managedJobs = [];
const manageSaveTimers = {};

refreshManageBtn.addEventListener('click', ()=>{ loadManageJobs(); loadDipMemory(); });

async function loadDipMemory(){
  const { data, error } = await supa.from('dip_items').select('*').order('item_number');
  if(error){ dipMemoryList.innerHTML = '<div style="color:var(--red);font-family:var(--mono);font-size:12px;">Error: '+esc(error.message)+'</div>'; return; }
  const items = data || [];
  if(!items.length){
    dipMemoryList.innerHTML = '';
    dipMemoryEmpty.style.display = 'block';
    return;
  }
  dipMemoryEmpty.style.display = 'none';
  dipMemoryList.innerHTML = items.map(d => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;">
      <span>${esc(d.item_number)}</span>
      <button class="removeBtn dipMemoryDeleteBtn" data-item="${esc(d.item_number)}">✕</button>
    </div>
  `).join('');
}

dipMemoryList.addEventListener('click', async (e)=>{
  const btn = e.target.closest('.dipMemoryDeleteBtn');
  if(!btn) return;
  const { error } = await supa.from('dip_items').delete().eq('item_number', btn.dataset.item);
  if(error){ alert('Failed to remove: ' + error.message); return; }
  loadDipMemory();
});

async function loadManageJobs(){
  const jobDate = jobDatePicker.value || new Date().toISOString().slice(0,10);
  const { data, error } = await supa.from('jobs').select('*').eq('job_date', jobDate).order('sort_order', { ascending: true });
  if(error){ manageList.innerHTML = '<div style="color:var(--red);font-family:var(--mono);font-size:12px;">Error: '+esc(error.message)+'</div>'; return; }
  managedJobs = data || [];
  renderManage();
}

function renderManage(){
  if(!managedJobs.length){
    manageList.innerHTML = '';
    manageEmpty.style.display = 'block';
    return;
  }
  manageEmpty.style.display = 'none';

  manageList.innerHTML = managedJobs.map((j, i) => `
    <div class="jobCard" data-id="${j.id}">
      <div class="rowTop">
        <span class="idx">JOB ${i+1}</span>
        <div style="display:flex;gap:6px;">
          <button class="reorderBtn manageUpBtn" data-id="${j.id}" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="reorderBtn manageDownBtn" data-id="${j.id}" ${i === managedJobs.length-1 ? 'disabled' : ''}>↓</button>
          <button class="removeBtn manageDeleteBtn" data-id="${j.id}">✕</button>
        </div>
      </div>
      <div class="fieldRow">
        <div><label>GRADE</label><input data-id="${j.id}" data-f="grade" value="${esc(j.grade)}"></div>
        <div><label>AM NUMBER</label><input data-id="${j.id}" data-f="am_number" value="${esc(j.am_number)}"></div>
      </div>
      <div class="fieldRow">
        <div><label>ITEM NUMBER</label><input data-id="${j.id}" data-f="item_number" value="${esc(j.item_number)}"></div>
        <div><label>CUSTOMER</label><input data-id="${j.id}" data-f="customer_name" value="${esc(j.customer_name)}"></div>
      </div>
      <div class="fieldRow">
        <div><label>WEIGHT PER CORE/MOULD (KG)</label><input data-id="${j.id}" data-f="weight_kg" type="number" step="any" value="${esc(j.weight_kg)}"></div>
        <div><label>PLANNED CORES/MOULDS</label><input data-id="${j.id}" data-f="planned_qty" type="number" value="${esc(j.planned_qty)}"></div>
      </div>
      <div class="fieldRow">
        <div><label>MINGZHI/HANSBERG NO.</label><input data-id="${j.id}" data-f="mingzhi_hansberg_no" value="${esc(j.mingzhi_hansberg_no)}"></div>
        <div><label>STATUS</label><input data-id="${j.id}" data-f="status" value="${esc(j.status)}"></div>
      </div>
      <div class="checkboxRow">
        <input type="checkbox" data-id="${j.id}" data-f="is_trial" id="manageTrial${j.id}" ${j.is_trial ? 'checked':''}>
        <label for="manageTrial${j.id}" style="font-size:12px;">Trial job</label>
      </div>
      <div class="checkboxRow">
        <input type="checkbox" data-id="${j.id}" data-f="is_doubles" id="manageDoubles${j.id}" ${j.is_doubles ? 'checked':''}>
        <label for="manageDoubles${j.id}" style="font-size:12px;">Doubles (2 cores per mould)</label>
      </div>
      <div class="manageSaveState" data-savestate="${j.id}"></div>
    </div>
  `).join('');
}

// Delegated listeners — bound once, never re-bound on render.
manageList.addEventListener('input', (e)=>{
  const inp = e.target.closest('input[data-f]');
  if(!inp || inp.type === 'checkbox') return;
  const job = managedJobs.find(j => j.id === inp.dataset.id);
  job[inp.dataset.f] = inp.value;
  queueManageSave(inp.dataset.id, inp.dataset.f, inp.value);
});

manageList.addEventListener('change', (e)=>{
  const cb = e.target.closest('input[type="checkbox"][data-f]');
  if(!cb) return;
  const job = managedJobs.find(j => j.id === cb.dataset.id);
  job[cb.dataset.f] = cb.checked;
  queueManageSave(cb.dataset.id, cb.dataset.f, cb.checked);
});

manageList.addEventListener('click', async (e)=>{
  const upBtn = e.target.closest('.manageUpBtn');
  const downBtn = e.target.closest('.manageDownBtn');
  const delBtn = e.target.closest('.manageDeleteBtn');

  if(upBtn || downBtn){
    const id = (upBtn || downBtn).dataset.id;
    const idx = managedJobs.findIndex(j => j.id === id);
    const swapIdx = upBtn ? idx - 1 : idx + 1;
    if(swapIdx < 0 || swapIdx >= managedJobs.length) return;
    const a = managedJobs[idx], b = managedJobs[swapIdx];
    const aOrder = a.sort_order, bOrder = b.sort_order;
    a.sort_order = bOrder; b.sort_order = aOrder;
    [managedJobs[idx], managedJobs[swapIdx]] = [managedJobs[swapIdx], managedJobs[idx]];
    renderManage();
    await Promise.all([
      supa.from('jobs').update({ sort_order: a.sort_order }).eq('id', a.id),
      supa.from('jobs').update({ sort_order: b.sort_order }).eq('id', b.id)
    ]);
    return;
  }

  if(delBtn){
    const id = delBtn.dataset.id;
    const job = managedJobs.find(j => j.id === id);
    if(!confirm(`Delete job ${job.am_number}? This also removes its trolley count. Cannot be undone.`)) return;
    const { error } = await supa.from('jobs').delete().eq('id', id);
    if(error){ alert('Delete failed: ' + error.message); return; }
    managedJobs = managedJobs.filter(j => j.id !== id);
    renderManage();
  }
});

function queueManageSave(id, field, value){
  const stateEl = document.querySelector(`.manageSaveState[data-savestate="${id}"]`);
  if(stateEl){ stateEl.textContent = 'unsaved…'; stateEl.className = 'manageSaveState'; }

  clearTimeout(manageSaveTimers[id]);
  manageSaveTimers[id] = setTimeout(async ()=>{
    const job = managedJobs.find(j => j.id === id);
    const patch = {};
    patch[field] = (field === 'weight_kg') ? (job[field] === '' ? null : parseFloat(job[field]))
      : (field === 'planned_qty') ? (job[field] === '' ? null : parseInt(job[field]))
      : job[field];
    const { error } = await supa.from('jobs').update(patch).eq('id', id);
    const el = document.querySelector(`.manageSaveState[data-savestate="${id}"]`);
    if(!el) return;
    if(error){ el.textContent = 'save failed: ' + error.message; el.style.color = 'var(--red)'; }
    else { el.textContent = 'saved'; el.className = 'manageSaveState saved'; }
  }, 500);
}

// ---------- Summary ----------
refreshSummaryBtn.addEventListener('click', loadSummary);

async function loadSummary(){
  const jobDate = jobDatePicker.value || new Date().toISOString().slice(0,10);
  const { data, error } = await supa.from('job_summary').select('*').eq('job_date', jobDate);
  if(error){ jobsTable.innerHTML = '<tr><td>Error: '+esc(error.message)+'</td></tr>'; return; }

  const rows = data || [];

  // stat tiles
  const totalTonnage = rows.reduce((sum, r) => sum + (r.tonnage || 0), 0);
  const shortCount = rows.filter(r => r.planned_qty != null && (r.counted_total ?? 0) < r.planned_qty).length;
  const dippingCount = rows.filter(r => r.needs_dipping).length;
  summaryStats.innerHTML = `
    <div class="statTile neutral"><div class="num">${rows.length}</div><div class="lbl">Jobs today</div></div>
    <div class="statTile neutral"><div class="num">${totalTonnage.toFixed(1)}t</div><div class="lbl">Total tonnage</div></div>
    <div class="statTile ${shortCount ? 'warn' : 'ok'}"><div class="num">${shortCount}</div><div class="lbl">Short of plan</div></div>
    <div class="statTile ${dippingCount ? 'warn' : 'ok'}"><div class="num">${dippingCount}</div><div class="lbl">Dipping due</div></div>
  `;

  // grade totals
  const gradeTotals = {};
  rows.forEach(r=>{
    const g = r.grade || '(no grade)';
    gradeTotals[g] = (gradeTotals[g] || 0) + (r.tonnage || 0);
  });
  gradeTable.innerHTML = '<tr><th>Grade</th><th>Tonnage</th></tr>' +
    Object.entries(gradeTotals).map(([g,t])=>`<tr><td>${esc(g)}</td><td class="gradeTotal">${t.toFixed(2)} t</td></tr>`).join('');

  jobsTable.innerHTML = rows.length ? rows.map(r=>{
    const planned = r.planned_qty ?? null;
    const counted = r.counted_total ?? 0;
    const mouldsCounted = Math.round(r.effective_qty ?? 0);
    const short = planned !== null && counted < planned;
    return `
      <div class="summaryJobCard">
        <div class="sjHead">
          <span class="sjAm">${esc(r.am_number)}</span>
          <span class="sjTonnage">${(r.tonnage||0).toFixed(2)} t</span>
        </div>
        <div class="sjSub">
          <span>${esc(r.grade) || '—'}</span>
          ${r.is_trial ? '<span class="badge badge-trial">TRIAL</span>' : ''}
          ${r.still_making ? '<span class="badge badge-warn">MAKING</span>' : ''}
        </div>
        <div class="sjMetrics">
          <div class="sjMetric"><div class="v">${planned ?? '—'}</div><div class="k">Planned</div></div>
          <div class="sjMetric"><div class="v" style="color:${short ? 'var(--red)' : 'var(--green)'};">${counted}/${mouldsCounted}</div><div class="k">Cores/moulds</div></div>
          <div class="sjMetric"><div class="v">${r.weight_kg ?? '—'}</div><div class="k">Weight (kg)</div></div>
        </div>
        <div class="sjFoot">
          <label class="sjDipRow"><input type="checkbox" class="dippingCheckbox" data-id="${r.id}" ${r.needs_dipping ? 'checked':''}> Dipping</label>
        </div>
        ${r.comment ? `<div class="sjComment">"${esc(r.comment)}"</div>` : ''}
      </div>`;
  }).join('') : '<div style="font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center;padding:20px 0;">No jobs for this day.</div>';

  jobsTable.querySelectorAll('.dippingCheckbox').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const { error } = await supa.from('jobs').update({ needs_dipping: cb.checked }).eq('id', cb.dataset.id);
      if(error){
        alert('Failed to update dipping flag: ' + error.message);
        cb.checked = !cb.checked;
        return;
      }
      if(cb.checked){
        const row = rows.find(r => r.id === cb.dataset.id);
        if(row && row.item_number){
          await supa.from('dip_items').upsert(
            { item_number: row.item_number, needs_dipping: true, updated_at: new Date().toISOString() },
            { onConflict: 'item_number' }
          );
        }
      }
    });
  });
}

function esc(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}
function setStatus(msg, cls){
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}

checkSession();
</script>
