<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Core Counting</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0908; --panel:#16130f; --line:#2a231a; --text:#e8e0d4; --dim:#8a8072;
    --amber:#ff8a1e; --green:#5fb87a; --red:#d9432e;
    --mono:'SF Mono','Courier New',ui-monospace,monospace; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%;}
  #app{max-width:520px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom)) 16px;}

  h1{font-size:20px;font-weight:700;margin:4px 0 2px 0;}
  .subtitle{font-size:12px;color:var(--dim);margin-bottom:16px;font-family:var(--mono);}

  #refreshBtn{
    width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);
    background:#1e1a14;color:var(--text);font-weight:600;font-size:14px;margin-bottom:16px;
  }

  .jobCard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .jobHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .amNumber{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--amber);}
  .planned{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .mhNumber{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:14px;}

  .dippingBanner{
    background:rgba(217,67,46,.15); color:var(--red); border:1px solid rgba(217,67,46,.4);
    font-family:var(--mono); font-weight:700; font-size:12px; text-align:center;
    padding:8px; border-radius:6px; margin-bottom:12px; letter-spacing:.03em;
  }

  .groupBox{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#120f0b;}
  .groupBox .groupLabel{font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:6px;letter-spacing:.03em;}
  .groupRow{display:flex;align-items:center;gap:8px;}
  .coresInput{
    flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:#1e1a14;color:var(--text);font-size:16px;font-family:var(--mono);text-align:center;
  }
  .coresInput::placeholder{color:var(--dim);}
  .stepper{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .stepBtn{
    width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#1e1a14;
    color:var(--amber);font-size:18px;font-weight:700;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .stepBtn:active{background:rgba(255,138,30,.2);}
  .trolleysNum{font-family:var(--mono);font-size:16px;font-weight:700;min-width:22px;text-align:center;}
  .groupSub{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:right;margin-top:4px;}

  .stillMakingRow{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .stillMakingRow input{width:auto;margin:0;}
  .stillMakingRow label{font-family:var(--mono);font-size:12px;color:var(--text);}

  .commentBox{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:#1e1a14;color:var(--text);font-size:13px;font-family:var(--sans);
    margin-bottom:10px;resize:vertical;min-height:44px;
  }
  .commentBox::placeholder{color:var(--dim);}

  .totalBox{
    background:#1e1a14;border-radius:8px;padding:12px;text-align:center;
    border:1px solid var(--line);
  }
  .totalBox .num{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--green);}
  .totalInput{
    width:100%;border:none;background:transparent;text-align:center;
    -webkit-appearance:none;
  }
  .totalInput:focus{outline:1px solid var(--green);border-radius:6px;}
  .totalBox .lbl{font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.03em;margin-top:4px;}

  .saveState{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:right;margin-top:6px;height:14px;}
  .saveState.saving{color:var(--amber);}
  .saveState.saved{color:var(--green);}

  #empty{color:var(--dim);font-family:var(--mono);font-size:13px;text-align:center;padding:40px 0;}

  #themeToggle{
    position:fixed;top:12px;right:12px;width:auto;padding:8px 12px;
    font-size:12px;font-family:var(--mono);border-radius:8px;border:1px solid var(--line);
    background:#1e1a14;color:var(--text);z-index:10;
  }

  body.light{
    --bg:#f5f1e8; --panel:#ffffff; --line:#ddd4c0; --text:#1a1610; --dim:#6b6152;
  }
</style>
</head>
<body>
<button id="themeToggle">🌙 Dark</button>
<div id="app">
  <h1>Core Counting</h1>
  <div class="subtitle">set cores per trolley, tap + for each trolley counted</div>
  <button id="refreshBtn">↻ Refresh job list</button>
  <div id="list"></div>
  <div id="empty" style="display:none;">No jobs yet — check back once the plan's been loaded.</div>
</div>

<script>
// ======================================================
// CONFIG — same values as main.html
// ======================================================
const SUPABASE_URL = 'https://dcaeetbbufwsbpdhsnhy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WufbIxfaujFYDbxcQgov4A_UWAHcgKn';
// ======================================================

// persistSession/autoRefreshToken/detectSessionInUrl off: this page must
// always act as anon, even if the same browser is logged into main.html
// (same Supabase project would otherwise share the login session here).
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const refreshBtn = document.getElementById('refreshBtn');

// ---------- Theme toggle ----------
const themeToggle = document.getElementById('themeToggle');
function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  themeToggle.textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';
}
applyTheme(localStorage.getItem('coreCountingTheme') || 'dark');
themeToggle.addEventListener('click', ()=>{
  const next = document.body.classList.contains('light') ? 'dark' : 'light';
  localStorage.setItem('coreCountingTheme', next);
  applyTheme(next);
});

let jobs = [];
const saveTimers = {}; // debounce per job

async function loadJobs(){
  const today = new Date().toISOString().slice(0,10);
  const { data, error } = await supa.from('trolley_jobs').select('*').eq('job_date', today);
  if(error){
    listEl.innerHTML = '<div style="color:var(--red);font-family:var(--mono);font-size:12px;">Error loading jobs: '+esc(error.message)+'</div>';
    return;
  }
  jobs = (data || []).map(j => ({
    ...j,
    group_a_cores: j.group_a_cores || 0,
    group_a_trolleys: j.group_a_trolleys || 0,
    group_b_cores: j.group_b_cores || 0,
    group_b_trolleys: j.group_b_trolleys || 0,
    comment: j.comment || '',
    still_making: !!j.still_making,
    manual_total_override: null // recomputed fresh each load; only set client-side when boys type a direct total
  }));
  render();
}

function render(){
  if(!jobs.length){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = jobs.map(j => `
    <div class="jobCard" data-job="${j.job_id}">
      <div class="jobHead">
        <span class="amNumber">${esc(j.am_number)}</span>
        <span class="planned">planned: ${esc(j.planned_qty)}</span>
      </div>
      <div class="mhNumber">M/H No: ${esc(j.mingzhi_hansberg_no)}</div>

      ${j.needs_dipping ? '<div class="dippingBanner">⚠ DIPPING REQUIRED</div>' : ''}

      ${groupBoxHtml(j, 'a')}
      ${groupBoxHtml(j, 'b')}

      <div class="stillMakingRow">
        <input type="checkbox" id="stillMaking-${j.job_id}" class="stillMakingCheckbox" data-job="${j.job_id}" ${j.still_making ? 'checked' : ''}>
        <label for="stillMaking-${j.job_id}">Still making — not finished yet</label>
      </div>

      <textarea class="commentBox" placeholder="Notes for the office…" data-job="${j.job_id}">${esc(j.comment)}</textarea>

      <div class="totalBox">
        <input type="number" inputmode="numeric" class="totalInput num" value="${computeTotal(j)}" data-job="${j.job_id}">
        <div class="lbl">TOTAL CORES — tap to type a final number directly</div>
      </div>
      <div class="saveState" data-savestate="${j.job_id}"></div>
    </div>
  `).join('');
}

function groupBoxHtml(j, g){
  const cores = j[`group_${g}_cores`] || 0;
  const trolleys = j[`group_${g}_trolleys`] || 0;
  return `
    <div class="groupBox">
      <div class="groupLabel">BOX ${g.toUpperCase()} — CORES PER TROLLEY</div>
      <div class="groupRow">
        <input type="number" inputmode="numeric" class="coresInput" placeholder="cores" value="${cores || ''}" data-job="${j.job_id}" data-group="${g}" data-field="cores">
        <div class="stepper">
          <div class="stepBtn minusBtn" data-job="${j.job_id}" data-group="${g}">−</div>
          <span class="trolleysNum" data-job="${j.job_id}" data-group="${g}" data-field="trolleysNum">${trolleys}</span>
          <div class="stepBtn plusBtn" data-job="${j.job_id}" data-group="${g}">+</div>
        </div>
      </div>
      <div class="groupSub" data-job="${j.job_id}" data-group="${g}" data-field="sub">${cores} × ${trolleys} = ${cores * trolleys}</div>
    </div>
  `;
}

function computeTotal(j){
  if(j.manual_total_override !== null && j.manual_total_override !== undefined) return j.manual_total_override;
  return (j.group_a_cores * j.group_a_trolleys) + (j.group_b_cores * j.group_b_trolleys);
}

// Delegated listeners — bound ONCE, never re-bound on render, so they
// never stack no matter how many times the list re-renders.
listEl.addEventListener('click', (e)=>{
  const minus = e.target.closest('.minusBtn');
  const plus = e.target.closest('.plusBtn');
  if(!minus && !plus) return;
  const btn = minus || plus;
  const jobId = btn.dataset.job;
  const g = btn.dataset.group;
  const job = jobs.find(j=>j.job_id === jobId);
  const field = `group_${g}_trolleys`;
  job[field] = Math.max(0, job[field] + (plus ? 1 : -1));
  job.manual_total_override = null;
  updateGroupDisplay(jobId, g);
  queueSave(jobId);
});

listEl.addEventListener('change', (e)=>{
  const cb = e.target.closest('.stillMakingCheckbox');
  if(!cb) return;
  const jobId = cb.dataset.job;
  const job = jobs.find(j=>j.job_id === jobId);
  job.still_making = cb.checked;
  queueSave(jobId);
});

listEl.addEventListener('input', (e)=>{
  const coresInput = e.target.closest('.coresInput');
  const totalInput = e.target.closest('.totalInput');
  const commentBox = e.target.closest('.commentBox');
  if(commentBox){
    const jobId = commentBox.dataset.job;
    const job = jobs.find(j=>j.job_id === jobId);
    job.comment = commentBox.value;
    queueSave(jobId);
    return;
  }
  if(coresInput){
    const jobId = coresInput.dataset.job;
    const g = coresInput.dataset.group;
    const job = jobs.find(j=>j.job_id === jobId);
    job[`group_${g}_cores`] = parseInt(coresInput.value) || 0;
    job.manual_total_override = null;
    updateGroupDisplay(jobId, g);
    queueSave(jobId);
    return;
  }
  if(totalInput){
    const jobId = totalInput.dataset.job;
    const job = jobs.find(j=>j.job_id === jobId);
    const val = parseInt(totalInput.value);
    job.manual_total_override = isNaN(val) ? null : val;
    queueSave(jobId);
  }
});

function updateGroupDisplay(jobId, g){
  const job = jobs.find(j=>j.job_id === jobId);
  const cores = job[`group_${g}_cores`];
  const trolleys = job[`group_${g}_trolleys`];
  document.querySelector(`.trolleysNum[data-job="${jobId}"][data-group="${g}"]`).textContent = trolleys;
  document.querySelector(`.groupSub[data-job="${jobId}"][data-group="${g}"]`).textContent = `${cores} × ${trolleys} = ${cores * trolleys}`;
  updateTotalDisplay(jobId);
}

function updateTotalDisplay(jobId){
  const job = jobs.find(j=>j.job_id === jobId);
  const totalInput = document.querySelector(`.totalInput[data-job="${jobId}"]`);
  if(totalInput) totalInput.value = computeTotal(job);
}

// ---------- Offline-safe save: failed saves persist in localStorage
// and auto-retry on reconnect, so a dead wifi spot doesn't silently
// lose a count.
const PENDING_KEY = 'coreCountingPendingSaves';
function getPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || '{}'); }catch(e){ return {}; } }
function setPendingEntry(jobId, payload){ const p = getPending(); p[jobId] = payload; localStorage.setItem(PENDING_KEY, JSON.stringify(p)); }
function clearPendingEntry(jobId){ const p = getPending(); delete p[jobId]; localStorage.setItem(PENDING_KEY, JSON.stringify(p)); }

function queueSave(jobId){
  const stateEl = document.querySelector(`[data-savestate="${jobId}"]`);
  stateEl.textContent = 'unsaved…';
  stateEl.className = 'saveState';

  clearTimeout(saveTimers[jobId]);
  saveTimers[jobId] = setTimeout(()=> performSave(jobId), 500);
}

async function performSave(jobId){
  const stateEl = document.querySelector(`[data-savestate="${jobId}"]`);
  const job = jobs.find(j=>j.job_id === jobId);
  if(!job) return;

  if(stateEl){ stateEl.textContent = 'saving…'; stateEl.className = 'saveState saving'; }

  const payload = {
    job_id: jobId,
    group_a_cores: job.group_a_cores || 0,
    group_a_trolleys: job.group_a_trolleys || 0,
    group_b_cores: job.group_b_cores || 0,
    group_b_trolleys: job.group_b_trolleys || 0,
    comment: job.comment || '',
    still_making: !!job.still_making,
    manual_total_override: job.manual_total_override ?? null,
    updated_at: new Date().toISOString()
  };

  const { error } = await supa.from('counts').upsert(payload, { onConflict: 'job_id' });

  if(error){
    setPendingEntry(jobId, payload);
    if(stateEl){
      stateEl.textContent = 'offline — will retry: ' + error.message;
      stateEl.className = 'saveState';
      stateEl.style.color = 'var(--red)';
    }
    setTimeout(()=> retryPendingSaves(), 15000);
  } else {
    clearPendingEntry(jobId);
    if(stateEl){ stateEl.textContent = 'saved'; stateEl.className = 'saveState saved'; }
  }
}

async function retryPendingSaves(){
  const pending = getPending();
  const jobIds = Object.keys(pending);
  if(!jobIds.length) return;
  for(const jobId of jobIds){
    const { error } = await supa.from('counts').upsert(pending[jobId], { onConflict: 'job_id' });
    const stateEl = document.querySelector(`[data-savestate="${jobId}"]`);
    if(!error){
      clearPendingEntry(jobId);
      if(stateEl){ stateEl.textContent = 'saved'; stateEl.className = 'saveState saved'; }
    }
  }
  if(Object.keys(getPending()).length) setTimeout(()=> retryPendingSaves(), 15000);
}

window.addEventListener('online', retryPendingSaves);

function esc(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

refreshBtn.addEventListener('click', loadJobs);
loadJobs();
retryPendingSaves();
</script>
</body>
</html>
<!-- redeploy trigger -->
