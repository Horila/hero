<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Core Counting</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0908; --panel:#16130f; --line:#2a231a; --text:#e8e0d4; --dim:#8a8072;
    --amber:#ff8a1e; --green:#5fb87a; --red:#d9432e;
    --mono:'SF Mono','Courier New',ui-monospace,monospace; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%;}
  #app{max-width:520px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom)) 16px;}

  h1{font-size:20px;font-weight:700;margin:4px 0 2px 0;}
  .subtitle{font-size:12px;color:var(--dim);margin-bottom:16px;font-family:var(--mono);}

  #refreshBtn{
    width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);
    background:#1e1a14;color:var(--text);font-weight:600;font-size:14px;margin-bottom:16px;
  }

  .jobCard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .jobHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .amNumber{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--amber);}
  .planned{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .mhNumber{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:14px;}

  .coresRow{margin-bottom:14px;}
  .coresRow label{display:block;font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:5px;}
  .coresRow input{
    width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);
    background:#1e1a14;color:var(--text);font-size:18px;font-family:var(--mono);text-align:center;
  }

  .trolleyRow{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .trolleyBtn{
    width:52px;height:52px;border-radius:10px;border:1px solid var(--line);
    background:#1e1a14;color:var(--amber);font-size:26px;font-weight:700;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .trolleyBtn:active{background:rgba(255,138,30,.2);}
  .trolleyCount{
    flex:1;text-align:center;font-family:var(--mono);font-size:24px;font-weight:700;
  }
  .trolleyCount .num{font-size:30px;}
  .trolleyCount .lbl{font-size:10px;color:var(--dim);display:block;margin-top:2px;}

  .totalBox{
    background:#1e1a14;border-radius:8px;padding:12px;text-align:center;
    border:1px solid var(--line);
  }
  .totalBox .num{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--green);}
  .totalBox .lbl{font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.05em;}

  .saveState{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:right;margin-top:6px;height:14px;}
  .saveState.saving{color:var(--amber);}
  .saveState.saved{color:var(--green);}

  #empty{color:var(--dim);font-family:var(--mono);font-size:13px;text-align:center;padding:40px 0;}
</style>
</head>
<body>
<div id="app">
  <h1>Core Counting</h1>
  <div class="subtitle">tap to update as you count</div>
  <button id="refreshBtn">↻ Refresh job list</button>
  <div id="list"></div>
  <div id="empty" style="display:none;">No jobs yet — check back once the plan's been loaded.</div>
</div>

<script>
// ======================================================
// CONFIG — same values as main.html
// ======================================================
const SUPABASE_URL = 'https://dcaeetbbufwsbpdhsnhy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WufbIxfaujFYDbxcQgov4A_UWAHcgKn';
// ======================================================

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const refreshBtn = document.getElementById('refreshBtn');

let jobs = [];
const saveTimers = {}; // debounce per job

async function loadJobs(){
  const { data, error } = await supa.from('trolley_jobs').select('*');
  if(error){
    listEl.innerHTML = '<div style="color:var(--red);font-family:var(--mono);font-size:12px;">Error loading jobs: '+esc(error.message)+'</div>';
    return;
  }
  jobs = data || [];
  render();
}

function render(){
  if(!jobs.length){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = jobs.map(j => `
    <div class="jobCard" data-job="${j.job_id}">
      <div class="jobHead">
        <span class="amNumber">${esc(j.am_number)}</span>
        <span class="planned">planned: ${esc(j.planned_qty)}</span>
      </div>
      <div class="mhNumber">M/H No: ${esc(j.mingzhi_hansberg_no)}</div>

      <div class="coresRow">
        <label>CORES PER TROLLEY</label>
        <input type="number" inputmode="numeric" class="coresInput" value="${j.cores_per_trolley || ''}" data-job="${j.job_id}">
      </div>

      <div class="trolleyRow">
        <div class="trolleyBtn minusBtn" data-job="${j.job_id}">−</div>
        <div class="trolleyCount">
          <div class="num" data-trolley-count="${j.job_id}">${j.trolley_count}</div>
          <span class="lbl">TROLLEYS</span>
        </div>
        <div class="trolleyBtn plusBtn" data-job="${j.job_id}">+</div>
      </div>

      <div class="totalBox">
        <div class="num" data-total="${j.job_id}">${j.total_cores}</div>
        <div class="lbl">TOTAL CORES</div>
      </div>
      <div class="saveState" data-savestate="${j.job_id}"></div>
    </div>
  `).join('');

  listEl.querySelectorAll('.coresInput').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const jobId = inp.dataset.job;
      const job = jobs.find(j=>j.job_id === jobId);
      job.cores_per_trolley = parseInt(inp.value) || 0;
      updateTotal(jobId);
      queueSave(jobId);
    });
  });
  listEl.querySelectorAll('.minusBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const jobId = btn.dataset.job;
      const job = jobs.find(j=>j.job_id === jobId);
      job.trolley_count = Math.max(0, job.trolley_count - 1);
      document.querySelector(`[data-trolley-count="${jobId}"]`).textContent = job.trolley_count;
      updateTotal(jobId);
      queueSave(jobId);
    });
  });
  listEl.querySelectorAll('.plusBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const jobId = btn.dataset.job;
      const job = jobs.find(j=>j.job_id === jobId);
      job.trolley_count = job.trolley_count + 1;
      document.querySelector(`[data-trolley-count="${jobId}"]`).textContent = job.trolley_count;
      updateTotal(jobId);
      queueSave(jobId);
    });
  });
}

function updateTotal(jobId){
  const job = jobs.find(j=>j.job_id === jobId);
  job.total_cores = (job.cores_per_trolley || 0) * (job.trolley_count || 0);
  document.querySelector(`[data-total="${jobId}"]`).textContent = job.total_cores;
}

function queueSave(jobId){
  const stateEl = document.querySelector(`[data-savestate="${jobId}"]`);
  stateEl.textContent = 'unsaved…';
  stateEl.className = 'saveState';

  clearTimeout(saveTimers[jobId]);
  saveTimers[jobId] = setTimeout(async ()=>{
    stateEl.textContent = 'saving…';
    stateEl.className = 'saveState saving';
    const job = jobs.find(j=>j.job_id === jobId);
    const { error } = await supa.from('counts').upsert({
      job_id: jobId,
      cores_per_trolley: job.cores_per_trolley || 0,
      trolley_count: job.trolley_count || 0,
      updated_at: new Date().toISOString()
    }, { onConflict: 'job_id' });

    if(error){
      stateEl.textContent = 'save failed';
      stateEl.className = 'saveState';
      stateEl.style.color = 'var(--red)';
    } else {
      stateEl.textContent = 'saved';
      stateEl.className = 'saveState saved';
    }
  }, 500);
}

function esc(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

refreshBtn.addEventListener('click', loadJobs);
loadJobs();
</script>
</body>
</html>
