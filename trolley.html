<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Core Counting</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#0a0908; --panel:#16130f; --elev:#1e1a14; --sunken:#120f0b; --line:#2a231a; --text:#e8e0d4; --dim:#8a8072;
    --amber:#ff8a1e; --green:#5fb87a; --red:#d9432e;
    --mono:'SF Mono','Courier New',ui-monospace,monospace; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%;}
  #app{max-width:520px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom)) 16px;}

  h1{font-size:20px;font-weight:700;margin:4px 0 2px 0;}
  .subtitle{font-size:12px;color:var(--dim);margin-bottom:16px;font-family:var(--mono);}
  .footerNote{font-size:11px;color:var(--dim);text-align:center;margin-top:24px;font-family:var(--mono);}

  #refreshBtn{
    width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);
    background:var(--elev);color:var(--text);font-weight:600;font-size:14px;margin-bottom:16px;
  }

  /* ---- Compact job list ---- */
  .jobRow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .jrMain{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .jrTop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;}
  .amNumber{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--amber);}
  .planned{font-family:var(--mono);font-size:10px;color:var(--dim);}
  .mhInline{font-family:var(--mono);font-size:10px;color:var(--dim);}
  .jrRight{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .jrTotal{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--green);min-width:30px;text-align:right;}

  .badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:5px;white-space:nowrap;}
  .badge-warn{background:rgba(217,67,46,.15);color:var(--red);}
  .badge-making{background:rgba(255,138,30,.15);color:var(--amber);}
  .badge-note{background:var(--elev);color:var(--text);border:1px solid var(--line);cursor:pointer;}

  .editToggleBtn{
    width:auto;padding:6px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--elev);color:var(--text);font-family:var(--sans);font-weight:600;font-size:11px;
  }

  .editPanel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}

  .dippingBanner{
    background:rgba(217,67,46,.15); color:var(--red); border:1px solid rgba(217,67,46,.4);
    font-family:var(--mono); font-weight:700; font-size:11px; text-align:center;
    padding:5px; border-radius:6px; margin-bottom:8px; letter-spacing:.03em;
  }

  .groupBox{border:1px solid var(--line);border-radius:7px;padding:7px 8px;margin-bottom:6px;background:var(--sunken);}
  .groupBox .groupLabel{font-family:var(--mono);font-size:9px;color:var(--dim);margin-bottom:4px;letter-spacing:.03em;}
  .groupRow{display:flex;align-items:center;gap:6px;}
  .coresInput{
    flex:1;padding:7px;border-radius:7px;border:1px solid var(--line);
    background:var(--elev);color:var(--text);font-size:15px;font-family:var(--mono);text-align:center;
  }
  .coresInput::placeholder{color:var(--dim);}
  .stepper{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .stepBtn{
    width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--elev);
    color:var(--amber);font-size:16px;font-weight:700;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .stepBtn:active{background:rgba(255,138,30,.2);}
  .trolleysNum{font-family:var(--mono);font-size:14px;font-weight:700;min-width:20px;text-align:center;}
  .groupSub{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:right;margin-top:3px;}

  .stillMakingRow{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .stillMakingRow input{width:auto;margin:0;}
  .stillMakingRow label{font-family:var(--mono);font-size:11px;color:var(--text);}

  .commentBox{
    width:100%;padding:7px;border-radius:7px;border:1px solid var(--line);
    background:var(--elev);color:var(--text);font-size:12px;font-family:var(--sans);
    margin-bottom:6px;resize:vertical;min-height:32px;
  }
  .commentBox::placeholder{color:var(--dim);}

  .totalBox{
    background:var(--elev);border-radius:7px;padding:8px;text-align:center;
    border:1px solid var(--line);
  }
  .totalBox .num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--green);}
  .totalInput{
    width:100%;border:none;background:transparent;color:var(--text);text-align:center;
    -webkit-appearance:none;
  }
  .totalInput:focus{outline:1px solid var(--green);border-radius:6px;}
  .totalBox .lbl{font-size:9px;color:var(--dim);font-family:var(--mono);letter-spacing:.03em;margin-top:3px;}

  .saveState{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:right;margin-top:4px;height:12px;}
  .saveState.saving{color:var(--amber);}
  .saveState.saved{color:var(--green);}

  #empty{color:var(--dim);font-family:var(--mono);font-size:13px;text-align:center;padding:40px 0;}

  #themeToggle{
    position:fixed;top:12px;right:12px;width:auto;padding:8px 12px;
    font-size:12px;font-family:var(--mono);border-radius:8px;border:1px solid var(--line);
    background:var(--elev);color:var(--text);z-index:10;
  }

  body.light{
    --bg:#f5f1e8; --panel:#ffffff; --elev:#f3ede0; --sunken:#ece4d3; --line:#ddd4c0; --text:#1a1610; --dim:#6b6152;
  }

  #chatToggleBtn{
    position:fixed;bottom:12px;right:12px;z-index:10;width:44px;height:44px;padding:0;
    border-radius:50%;background:var(--elev);border:1px solid var(--line);
    font-size:18px;display:flex;align-items:center;justify-content:center;
  }
  #chatDot{
    position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;
    background:var(--red);border:2px solid var(--bg);display:none;
  }
  #chatDot.show{display:block;}
  #chatPanel{
    position:fixed;bottom:64px;right:12px;z-index:10;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;
    width:260px;max-width:calc(100vw - 24px);display:none;flex-direction:column;
  }
  #chatPanel.open{display:flex;}
  #chatPanel .chatHead{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.03em;padding:10px 10px 0 10px;}
  #chatMessages{max-height:260px;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
  .chatMsg{max-width:85%;padding:6px 9px;border-radius:10px;font-size:12px;line-height:1.35;}
  .chatMsg .chatMeta{font-family:var(--mono);font-size:9px;color:var(--dim);margin-bottom:2px;}
  .chatMsg.mine{align-self:flex-end;background:var(--elev);}
  .chatMsg.theirs{align-self:flex-start;background:var(--sunken);}
  #chatEmpty{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding:10px 0;}
  .chatInputRow{display:flex;gap:6px;padding:8px 10px 10px 10px;border-top:1px solid var(--line);}
  .chatInputRow input{
    flex:1;padding:7px;border-radius:7px;border:1px solid var(--line);
    background:var(--elev);color:var(--text);font-size:12px;font-family:var(--sans);
  }
  #chatSendBtn{width:auto;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--elev);color:var(--text);font-size:12px;font-weight:600;}

  #notesOverlay{
    position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  #notesOverlay.open{display:flex;}
  #notesCard{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    width:100%;max-width:340px;max-height:70vh;display:flex;flex-direction:column;overflow:hidden;
  }
  .notesHead{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 12px;border-bottom:1px solid var(--line);
    font-family:var(--sans);font-size:13px;font-weight:700;color:var(--text);
  }
  #notesCloseBtn{width:auto;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--elev);color:var(--text);font-size:13px;}
  #notesBody{overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
  .noteEntry{background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12px;color:var(--text);line-height:1.4;}
  .noteEntry .noteTime{font-family:var(--mono);font-size:9px;color:var(--dim);margin-bottom:3px;}
</style>
</head>
<body>
<button id="themeToggle">🌙 Dark</button>
<div id="app">
  <h1>Core Counting</h1>
  <div class="subtitle">tap Edit to set cores per trolley</div>
  <button id="refreshBtn">↻ Refresh job list</button>
  <div id="dayWarning" style="display:none;"></div>
  <div id="list"></div>
  <div id="empty" style="display:none;">No jobs yet — check back once the plan's been loaded.</div>
  <div class="footerNote">All rights reserved.<br>Project built in collaboration with Fararyi 💪</div>
</div>

<button id="chatToggleBtn">💬<span id="chatDot"></span></button>
<div id="chatPanel">
  <div class="chatHead">CHAT WITH OFFICE</div>
  <div id="chatMessages"></div>
  <div id="chatEmpty" style="display:none;">No messages yet</div>
  <div class="chatInputRow">
    <input type="text" id="chatInput" placeholder="Message the office…">
    <button id="chatSendBtn">Send</button>
  </div>
</div>

<div id="notesOverlay">
  <div id="notesCard">
    <div class="notesHead">
      <span id="notesTitle">Notes from office</span>
      <button id="notesCloseBtn">✕</button>
    </div>
    <div id="notesBody"></div>
  </div>
</div>

<script>
// SUPABASE_URL / SUPABASE_ANON_KEY come from config.js (shared with main.html)

// persistSession/autoRefreshToken/detectSessionInUrl off: this page must
// always act as anon, even if the same browser is logged into main.html
// (same Supabase project would otherwise share the login session here).
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const refreshBtn = document.getElementById('refreshBtn');
const dayWarningEl = document.getElementById('dayWarning');

// ---------- Theme toggle ----------
const themeToggle = document.getElementById('themeToggle');
function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  themeToggle.textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';
}
applyTheme(localStorage.getItem('coreCountingTheme') || 'light');
themeToggle.addEventListener('click', ()=>{
  const next = document.body.classList.contains('light') ? 'dark' : 'light';
  localStorage.setItem('coreCountingTheme', next);
  applyTheme(next);
});

let jobs = [];
let jobNotes = {}; // job_id -> [{body, created_at}] — office notes visible to trolley, refetched each loadJobs()
let editingIds = new Set();
const saveTimers = {}; // debounce per job
let currentDay = null;

async function loadJobs(){
  const { data: pub, error: pubError } = await supa.from('published_day').select('job_date').eq('id', 1).single();
  if(pubError){
    dayWarningEl.style.display = 'block';
    dayWarningEl.style.color = 'var(--red)';
    dayWarningEl.textContent = "Couldn't confirm today's published day (" + pubError.message + ') — showing local date, tell Horatio if this looks wrong.';
  } else {
    dayWarningEl.style.display = 'none';
  }
  const day = pub ? pub.job_date : new Date().toISOString().slice(0,10); // falls back to real today if not migrated yet
  currentDay = day;
  const { data, error } = await supa.from('trolley_jobs').select('*').eq('job_date', day).order('sort_order', { ascending: true });
  if(error){
    listEl.innerHTML = '<div style="color:var(--red);font-family:var(--mono);font-size:12px;">Error loading jobs: '+esc(error.message)+'</div>';
    return;
  }
  jobs = (data || []).map(j => ({
    ...j,
    group_a_cores: j.group_a_cores || 0,
    group_a_trolleys: j.group_a_trolleys || 0,
    group_b_cores: j.group_b_cores || 0,
    group_b_trolleys: j.group_b_trolleys || 0,
    comment: j.comment || '',
    still_making: !!j.still_making,
    manual_total_override: null // recomputed fresh each load; only set client-side when boys type a direct total
  }));
  editingIds = new Set([...editingIds].filter(id => jobs.some(j => j.job_id === id)));
  await loadJobNotes();
  render();
}

function render(){
  if(!jobs.length){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = jobs.map(j => {
    const editing = editingIds.has(j.job_id);
    return `
    <div class="jobRow" data-job="${j.job_id}">
      <div class="jrMain">
        <div class="jrTop">
          <span class="amNumber">${esc(j.am_number)}</span>
          <span class="planned">plan ${esc(j.planned_qty)}</span>
          <span class="mhInline">Mingzhi ${esc(j.mingzhi_hansberg_no)}</span>
          ${j.needs_dipping ? '<span class="badge badge-warn">DIP</span>' : ''}
          ${j.still_making ? '<span class="badge badge-making">MAKING</span>' : ''}
          ${(jobNotes[j.job_id] || []).length ? `<button class="badge badge-note" data-job="${j.job_id}">📝</button>` : ''}
        </div>
        <div class="jrRight">
          <span class="jrTotal" data-job="${j.job_id}">${computeTotal(j)}</span>
          <button class="editToggleBtn" data-job="${j.job_id}">${editing ? 'Done' : 'Edit'}</button>
        </div>
      </div>
      ${editing ? `
      <div class="editPanel">
        ${j.needs_dipping ? '<div class="dippingBanner">⚠ DIPPING REQUIRED</div>' : ''}
        ${groupBoxHtml(j, 'a')}
        ${groupBoxHtml(j, 'b')}

        <div class="stillMakingRow">
          <input type="checkbox" id="stillMaking-${j.job_id}" class="stillMakingCheckbox" data-job="${j.job_id}" ${j.still_making ? 'checked' : ''}>
          <label for="stillMaking-${j.job_id}">Still making — not finished yet</label>
        </div>

        <textarea class="commentBox" placeholder="Notes for the office…" data-job="${j.job_id}">${esc(j.comment)}</textarea>

        <div class="totalBox">
          <input type="number" inputmode="numeric" class="totalInput num" value="${computeTotal(j)}" data-job="${j.job_id}">
          <div class="lbl">TOTAL CORES — tap to type a final number directly</div>
        </div>
        <div class="saveState" data-savestate="${j.job_id}"></div>
      </div>` : ''}
    </div>`;
  }).join('');
}

function groupBoxHtml(j, g){
  const cores = j[`group_${g}_cores`] || 0;
  const trolleys = j[`group_${g}_trolleys`] || 0;
  return `
    <div class="groupBox">
      <div class="groupLabel">BOX ${g.toUpperCase()} — CORES PER TROLLEY</div>
      <div class="groupRow">
        <input type="number" inputmode="numeric" class="coresInput" placeholder="cores" value="${cores || ''}" data-job="${j.job_id}" data-group="${g}" data-field="cores">
        <div class="stepper">
          <div class="stepBtn minusBtn" data-job="${j.job_id}" data-group="${g}">−</div>
          <span class="trolleysNum" data-job="${j.job_id}" data-group="${g}" data-field="trolleysNum">${trolleys}</span>
          <div class="stepBtn plusBtn" data-job="${j.job_id}" data-group="${g}">+</div>
        </div>
      </div>
      <div class="groupSub" data-job="${j.job_id}" data-group="${g}" data-field="sub">${cores} × ${trolleys} = ${cores * trolleys}</div>
    </div>
  `;
}

function computeTotal(j){
  if(j.manual_total_override !== null && j.manual_total_override !== undefined) return j.manual_total_override;
  return (j.group_a_cores * j.group_a_trolleys) + (j.group_b_cores * j.group_b_trolleys);
}

// Delegated listeners — bound ONCE, never re-bound on render, so they
// never stack no matter how many times the list re-renders.
listEl.addEventListener('click', (e)=>{
  const editBtn = e.target.closest('.editToggleBtn');
  if(editBtn){
    const jobId = editBtn.dataset.job;
    if(editingIds.has(jobId)) editingIds.delete(jobId); else editingIds.add(jobId);
    render();
    return;
  }

  const minus = e.target.closest('.minusBtn');
  const plus = e.target.closest('.plusBtn');
  if(!minus && !plus) return;
  const btn = minus || plus;
  const jobId = btn.dataset.job;
  const g = btn.dataset.group;
  const job = jobs.find(j=>j.job_id === jobId);
  const field = `group_${g}_trolleys`;
  job[field] = Math.max(0, job[field] + (plus ? 1 : -1));
  job.manual_total_override = null;
  updateGroupDisplay(jobId, g);
  queueSave(jobId);
});

listEl.addEventListener('change', (e)=>{
  const cb = e.target.closest('.stillMakingCheckbox');
  if(!cb) return;
  const jobId = cb.dataset.job;
  const job = jobs.find(j=>j.job_id === jobId);
  job.still_making = cb.checked;
  queueSave(jobId);
  render(); // refreshes the MAKING badge in the collapsed header
});

listEl.addEventListener('input', (e)=>{
  const coresInput = e.target.closest('.coresInput');
  const totalInput = e.target.closest('.totalInput');
  const commentBox = e.target.closest('.commentBox');
  if(commentBox){
    const jobId = commentBox.dataset.job;
    const job = jobs.find(j=>j.job_id === jobId);
    job.comment = commentBox.value;
    queueSave(jobId);
    return;
  }
  if(coresInput){
    const jobId = coresInput.dataset.job;
    const g = coresInput.dataset.group;
    const job = jobs.find(j=>j.job_id === jobId);
    job[`group_${g}_cores`] = parseInt(coresInput.value) || 0;
    job.manual_total_override = null;
    updateGroupDisplay(jobId, g);
    queueSave(jobId);
    return;
  }
  if(totalInput){
    const jobId = totalInput.dataset.job;
    const job = jobs.find(j=>j.job_id === jobId);
    const val = parseInt(totalInput.value);
    job.manual_total_override = isNaN(val) ? null : val;
    updateTotalDisplay(jobId);
    queueSave(jobId);
  }
});

function updateGroupDisplay(jobId, g){
  const job = jobs.find(j=>j.job_id === jobId);
  const cores = job[`group_${g}_cores`];
  const trolleys = job[`group_${g}_trolleys`];
  document.querySelector(`.trolleysNum[data-job="${jobId}"][data-group="${g}"]`).textContent = trolleys;
  document.querySelector(`.groupSub[data-job="${jobId}"][data-group="${g}"]`).textContent = `${cores} × ${trolleys} = ${cores * trolleys}`;
  updateTotalDisplay(jobId);
}

function updateTotalDisplay(jobId){
  const job = jobs.find(j=>j.job_id === jobId);
  const total = computeTotal(job);
  const totalInput = document.querySelector(`.totalInput[data-job="${jobId}"]`);
  if(totalInput) totalInput.value = total;
  const jrTotal = document.querySelector(`.jrTotal[data-job="${jobId}"]`);
  if(jrTotal) jrTotal.textContent = total;
}

// ---------- Offline-safe save: failed saves persist in localStorage
// and auto-retry on reconnect, so a dead wifi spot doesn't silently
// lose a count.
const PENDING_KEY = 'coreCountingPendingSaves';
function getPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || '{}'); }catch(e){ return {}; } }
function setPendingEntry(jobId, payload){ const p = getPending(); p[jobId] = payload; localStorage.setItem(PENDING_KEY, JSON.stringify(p)); }
function clearPendingEntry(jobId){ const p = getPending(); delete p[jobId]; localStorage.setItem(PENDING_KEY, JSON.stringify(p)); }

function queueSave(jobId){
  const stateEl = document.querySelector(`[data-savestate="${jobId}"]`);
  if(stateEl){ stateEl.textContent = 'unsaved…'; stateEl.className = 'saveState'; }

  clearTimeout(saveTimers[jobId]);
  saveTimers[jobId] = setTimeout(()=> performSave(jobId), 500);
}

async function upsertCount(jobId, payload){
  const { error } = await supa.from('counts').upsert(payload, { onConflict: 'job_id' });
  return { ok: !error, error };
}

// Single shared timer chain for offline retries: both the initial failure
// (from performSave) and each subsequent retry (from retryPendingSaves)
// route through here, so concurrent failures never stack overlapping chains.
let retryTimer = null;
function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer = setTimeout(retryPendingSaves, 15000);
}

async function performSave(jobId){
  const stateEl = document.querySelector(`[data-savestate="${jobId}"]`);
  const job = jobs.find(j=>j.job_id === jobId);
  if(!job) return;

  if(stateEl){ stateEl.textContent = 'saving…'; stateEl.className = 'saveState saving'; }

  const payload = {
    job_id: jobId,
    group_a_cores: job.group_a_cores || 0,
    group_a_trolleys: job.group_a_trolleys || 0,
    group_b_cores: job.group_b_cores || 0,
    group_b_trolleys: job.group_b_trolleys || 0,
    comment: job.comment || '',
    still_making: !!job.still_making,
    manual_total_override: job.manual_total_override ?? null,
    updated_at: new Date().toISOString()
  };

  const { ok, error } = await upsertCount(jobId, payload);

  if(!ok){
    setPendingEntry(jobId, payload);
    if(stateEl){
      stateEl.textContent = 'offline — will retry: ' + error.message;
      stateEl.className = 'saveState';
      stateEl.style.color = 'var(--red)';
    }
    scheduleRetry();
  } else {
    clearPendingEntry(jobId);
    if(stateEl){ stateEl.textContent = 'saved'; stateEl.className = 'saveState saved'; }
  }
}

async function retryPendingSaves(){
  const pending = getPending();
  const jobIds = Object.keys(pending);
  if(!jobIds.length) return;
  for(const jobId of jobIds){
    const { ok } = await upsertCount(jobId, pending[jobId]);
    const stateEl = document.querySelector(`[data-savestate="${jobId}"]`);
    if(ok){
      clearPendingEntry(jobId);
      if(stateEl){ stateEl.textContent = 'saved'; stateEl.className = 'saveState saved'; }
    }
  }
  if(Object.keys(getPending()).length) scheduleRetry();
}

window.addEventListener('online', retryPendingSaves);

function esc(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

// ---------- Notes from office (read-only) ----------
const notesOverlay = document.getElementById('notesOverlay');
const notesTitle = document.getElementById('notesTitle');
const notesBody = document.getElementById('notesBody');
const notesCloseBtn = document.getElementById('notesCloseBtn');

// Merges two sources into the same per-job list: job_notes (about this specific day's
// job) and item_reference_notes (a standing note about the PART itself, matched by
// item_number — trolley_jobs now exposes it — and fanned out to every one of today's
// jobs that shares that item_number, not just one).
async function loadJobNotes(){
  jobNotes = {};
  if(!jobs.length) return;

  const { data: jn } = await supa.from('job_notes').select('*')
    .eq('visible_to_trolley', true).in('job_id', jobs.map(j => j.job_id));
  for(const n of (jn || [])){
    (jobNotes[n.job_id] = jobNotes[n.job_id] || []).push({ body: n.body, created_at: n.created_at });
  }

  const itemNumbers = [...new Set(jobs.map(j => j.item_number).filter(Boolean))];
  if(itemNumbers.length){
    const { data: irn } = await supa.from('item_reference_notes').select('*')
      .eq('visible_to_trolley', true).in('item_number', itemNumbers);
    for(const n of (irn || [])){
      for(const j of jobs.filter(j => j.item_number === n.item_number)){
        (jobNotes[j.job_id] = jobNotes[j.job_id] || []).push({ body: n.body, created_at: n.created_at });
      }
    }
  }

  for(const jobId in jobNotes) jobNotes[jobId].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
}

function openNotesPopup(jobId){
  const job = jobs.find(j => j.job_id === jobId);
  const notes = jobNotes[jobId] || [];
  notesTitle.textContent = 'Notes from office' + (job ? ' — ' + job.am_number : '');
  notesBody.innerHTML = notes.map(n => `
    <div class="noteEntry">
      <div class="noteTime">${esc(new Date(n.created_at).toLocaleString())}</div>
      ${esc(n.body)}
    </div>
  `).join('');
  notesOverlay.classList.add('open');
}
function closeNotesPopup(){ notesOverlay.classList.remove('open'); }

notesCloseBtn.addEventListener('click', closeNotesPopup);
notesOverlay.addEventListener('click', (e)=>{ if(e.target === notesOverlay) closeNotesPopup(); });
listEl.addEventListener('click', (e)=>{
  const noteBtn = e.target.closest('.badge-note');
  if(noteBtn) openNotesPopup(noteBtn.dataset.job);
});

// ---------- Chat ----------
const chatToggleBtn = document.getElementById('chatToggleBtn');
const chatDot = document.getElementById('chatDot');
const chatPanel = document.getElementById('chatPanel');
const chatMessages = document.getElementById('chatMessages');
const chatEmpty = document.getElementById('chatEmpty');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');
const CHAT_SEEN_KEY = 'coreCountingChatSeenTrolley';
const CHAT_NAME_KEY = 'coreCountingChatName';

let chatOpen = false;
let lastChatMessages = [];

function getChatName(){
  let name = localStorage.getItem(CHAT_NAME_KEY);
  if(!name){
    name = (window.prompt('Your name, for the chat with the office?') || '').trim() || 'Trolley';
    localStorage.setItem(CHAT_NAME_KEY, name);
  }
  return name;
}

function updateChatDot(){
  const seen = localStorage.getItem(CHAT_SEEN_KEY) || '';
  const unread = lastChatMessages.some(m => m.sender_role === 'admin' && m.created_at > seen);
  chatDot.classList.toggle('show', unread && !chatOpen);
}

function markChatSeen(){
  if(!lastChatMessages.length) return;
  localStorage.setItem(CHAT_SEEN_KEY, lastChatMessages[lastChatMessages.length - 1].created_at);
  chatDot.classList.remove('show');
}

function renderChatMessages(){
  if(!lastChatMessages.length){
    chatMessages.innerHTML = '';
    chatEmpty.style.display = 'block';
    return;
  }
  chatEmpty.style.display = 'none';
  chatMessages.innerHTML = lastChatMessages.map(m => {
    const mine = m.sender_role === 'trolley';
    const who = mine ? (m.sender_name || 'You') : 'Office';
    const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `<div class="chatMsg ${mine ? 'mine' : 'theirs'}"><div class="chatMeta">${esc(who)} · ${time}</div>${esc(m.body)}</div>`;
  }).join('');
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function loadChat(){
  const day = currentDay || new Date().toISOString().slice(0,10);
  const { data, error } = await supa.from('chat_messages').select('*').eq('job_date', day).order('created_at', { ascending: true });
  if(error) return;
  lastChatMessages = data || [];
  renderChatMessages();
  updateChatDot();
  if(chatOpen) markChatSeen();
}

chatToggleBtn.addEventListener('click', ()=>{
  chatOpen = !chatOpen;
  chatPanel.classList.toggle('open', chatOpen);
  if(chatOpen){ markChatSeen(); loadChat(); }
});

async function sendChatMessage(){
  const body = chatInput.value.trim();
  if(!body) return;
  const day = currentDay || new Date().toISOString().slice(0,10);
  const name = getChatName();
  chatInput.value = '';
  const { error } = await supa.from('chat_messages').insert({ job_date: day, sender_role: 'trolley', sender_name: name, body });
  if(error){ alert("Message didn't send — check the connection and try again."); return; }
  loadChat();
}

chatSendBtn.addEventListener('click', sendChatMessage);
chatInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); sendChatMessage(); } });

refreshBtn.addEventListener('click', loadJobs);
loadJobs();
retryPendingSaves();
loadChat();
setInterval(loadChat, 12000);
</script>
